<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#121212">
  <link rel="manifest" href="/manifest.json">
  <title>termade companion</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --border: #333;
      --text: #e0e0e0;
      --dim: #888;
      --cyan: #00e5ff;
      --green: #00e676;
      --yellow: #ffd600;
      --red: #ff1744;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.4;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    header {
      background: #181818;
      border-bottom: 1px solid var(--border);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .status-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--dim);
      margin-right: 6px;
    }
    .status-dot.connected { background: var(--green); }
    .status-dot.connecting { background: var(--yellow); }
    .status-dot.disconnected { background: var(--red); }
    .header-stats {
      font-size: 11px;
      color: var(--dim);
    }
    .header-stats span { margin-left: 8px; }

    /* 核准橫幅 */
    #approval-banner {
      background: #2b1f00;
      border-bottom: 2px solid var(--yellow);
      padding: 10px 12px;
      display: none;
      flex-shrink: 0;
      animation: pulse 1.5s infinite alternate;
    }
    @keyframes pulse { from { background: #2b1f00; } to { background: #3d2c00; } }
    .approval-title {
      font-weight: bold;
      color: var(--yellow);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .approval-detail {
      font-size: 12px;
      color: #fff;
      word-break: break-all;
      background: #111;
      padding: 6px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .btn-group { display: flex; gap: 8px; }
    button {
      font-family: inherit;
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      touch-action: manipulation;
    }
    .btn-allow { background: var(--green); color: #000; flex: 1; }
    .btn-always { background: var(--cyan); color: #000; }
    .btn-deny { background: var(--red); color: #fff; flex: 1; }

    /* Session 膠囊列 */
    #session-bar {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      background: #161616;
      border-bottom: 1px solid var(--border);
      padding: 6px 8px;
      gap: 6px;
      flex-shrink: 0;
      scrollbar-width: none;
    }
    #session-bar::-webkit-scrollbar { display: none; }
    .session-chip {
      padding: 5px 10px;
      border-radius: 14px;
      background: #252525;
      color: var(--dim);
      font-size: 12px;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .session-chip.active {
      background: #1a2a3a;
      color: var(--cyan);
      border-color: var(--cyan);
    }
    .session-chip.waiting {
      border-color: var(--yellow);
      color: var(--yellow);
    }
    .session-chip.add-btn {
      background: #1f3325;
      color: var(--green);
      border: 1px dashed var(--green);
    }

    /* 導覽分頁列 */
    #tab-bar {
      display: flex;
      background: #1a1a1a;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tab-btn {
      flex: 1;
      text-align: center;
      padding: 9px 0;
      color: var(--dim);
      background: transparent;
      border-radius: 0;
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active {
      color: var(--cyan);
      border-bottom-color: var(--cyan);
    }

    /* 主畫面視圖區 */
    #content-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      position: relative;
    }
    .view-pane { display: none; height: 100%; }
    .view-pane.active { display: flex; flex-direction: column; }

    /* 逐字稿 */
    #transcript-box {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-bottom: 8px;
    }
    .msg-row {
      padding: 6px 8px;
      border-radius: 4px;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .msg-user {
      background: #182838;
      color: var(--cyan);
      align-self: flex-end;
      max-width: 92%;
      border-left: 3px solid var(--cyan);
    }
    .msg-agent {
      background: #1e1e1e;
      color: var(--text);
      max-width: 96%;
      border-left: 3px solid #555;
    }
    .msg-tool {
      background: #181818;
      border: 1px solid var(--border);
      color: var(--dim);
      font-size: 12px;
    }
    details {
      margin-top: 4px;
      padding: 4px;
      background: #111;
      border-radius: 4px;
    }
    summary { cursor: pointer; color: var(--dim); }

    /* 狀態提示列 */
    #session-notice-bar {
      background: #262214;
      border: 1px solid var(--yellow);
      color: var(--yellow);
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      display: none;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .btn-resume {
      background: var(--yellow);
      color: #000;
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 4px;
    }

    /* Diff 視圖 */
    #pane-diff { flex: 1; overflow-y: auto; }
    .diff-line-add { background: rgba(0, 230, 118, 0.15); color: #69f0ae; }
    .diff-line-del { background: rgba(255, 23, 68, 0.15); color: #ff5252; }
    .diff-line-hdr { color: var(--cyan); font-weight: bold; }
    .diff-row { padding: 3px 6px; cursor: pointer; font-size: 12px; white-space: pre-wrap; }

    /* Tasks 視圖 */
    #pane-tasks { flex: 1; overflow-y: auto; }
    .task-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .task-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }
    .task-status-todo { background: #332b00; color: var(--yellow); border: 1px solid var(--yellow); }
    .task-status-doing { background: #003314; color: var(--green); border: 1px solid var(--green); }
    .task-status-blocked { background: #33000b; color: var(--red); border: 1px solid var(--red); }
    .task-status-done { background: #222; color: var(--dim); text-decoration: line-through; }

    /* 底部輸入列 */
    #input-bar {
      background: #181818;
      border-top: 1px solid var(--border);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .input-row { display: flex; gap: 8px; align-items: flex-end; }
    #prompt-input {
      flex: 1;
      background: #101010;
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 6px;
      resize: none;
      min-height: 38px;
      max-height: 120px;
      outline: none;
    }
    #prompt-input:focus { border-color: var(--cyan); }
    .btn-send { background: var(--cyan); color: #000; height: 38px; }
    .btn-cancel { background: #333; color: var(--red); height: 38px; }
    .input-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--dim);
    }
    .checkbox-label { display: flex; align-items: center; gap: 4px; cursor: pointer; }

    /* 彈出提示 Toast */
    #toast {
      position: fixed;
      bottom: 75px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30,30,30,0.95);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 1000;
    }
    #toast.show { opacity: 1; }
    #toast.error { border-color: var(--red); color: var(--red); }
  </style>
</head>
<body>
  <header>
    <div>
      <span id="conn-dot" class="status-dot"></span>
      <span id="conn-text" style="font-weight:bold;">termade</span>
    </div>
    <div class="header-stats">
      <span id="stat-cost">$0.00</span>
      <span id="stat-live">0 live</span>
    </div>
  </header>

  <div id="approval-banner">
    <div class="approval-title">
      <span>待核准操作 (Waiting Approval)</span>
      <span id="approval-session"></span>
    </div>
    <div id="approval-detail" class="approval-detail"></div>
    <div class="btn-group">
      <button class="btn-allow" onclick="decide('allow')">Allow</button>
      <button class="btn-always" onclick="decide('always')">Always</button>
      <button class="btn-deny" onclick="decide('deny')">Deny</button>
    </div>
  </div>

  <div id="session-bar"></div>

  <div id="tab-bar">
    <button class="tab-btn active" onclick="switchTab('transcript')">逐字稿</button>
    <button class="tab-btn" onclick="switchTab('diff')">Diff</button>
    <button class="tab-btn" onclick="switchTab('tasks')">任務板</button>
  </div>

  <div id="content-area">
    <div id="pane-transcript" class="view-pane active">
      <div id="session-notice-bar">
        <span id="session-notice-text">Session 已結束</span>
        <button class="btn-resume" onclick="resumeSession()">接續 (Resume)</button>
      </div>
      <div id="transcript-box"></div>
    </div>
    <div id="pane-diff" class="view-pane">
      <div style="margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
        <span id="diff-info" style="color:var(--dim); font-size:12px;">無變更</span>
        <button id="btn-merge" class="btn-always" style="padding:4px 10px; font-size:12px; display:none;" onclick="mergeDiff()">Merge</button>
      </div>
      <div id="diff-container" style="font-size:12px;"></div>
    </div>
    <div id="pane-tasks" class="view-pane">
      <div style="margin-bottom: 8px; display:flex; justify-content: flex-end;">
        <button class="btn-always" style="padding:4px 10px; font-size:12px;" onclick="promptNewTask()">+ 建立新任務</button>
      </div>
      <div id="tasks-container"></div>
    </div>
  </div>

  <div id="input-bar">
    <div class="input-options">
      <label class="checkbox-label">
        <input type="checkbox" id="queue-checkbox"> 忙碌時排入佇列
      </label>
      <span id="status-note" style="color:var(--yellow)"></span>
    </div>
    <div class="input-row">
      <textarea id="prompt-input" rows="1" placeholder="輸入 prompt..."></textarea>
      <button class="btn-cancel" onclick="cancelTurn()">中斷</button>
      <button class="btn-send" onclick="sendPrompt()">送出</button>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    let token = "";
    const hash = window.location.hash.substring(1);
    const hashParams = new URLSearchParams(hash);
    if (hashParams.has("token")) {
      token = hashParams.get("token");
      localStorage.setItem("termade_token", token);
      window.location.hash = "";
    } else {
      token = localStorage.getItem("termade_token") || "";
    }

    let ws = null;
    let state = {
      sessions: {},
      tasks: {},
      pending_permissions: {},
      transcripts: {},
      seq: 0
    };
    let activeSession = null;
    let currentTab = "transcript";
    let daemonEpoch = null;
    let pendingApprovalReq = null;

    function showToast(msg, isError = false) {
      const t = document.getElementById("toast");
      t.innerText = msg;
      t.className = `show ${isError ? "error" : ""}`;
      setTimeout(() => { t.className = ""; }, 3000);
    }

    function connect() {
      const dot = document.getElementById("conn-dot");
      const text = document.getElementById("conn-text");
      dot.className = "status-dot connecting";
      text.innerText = "連線中…";

      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

      ws.onopen = () => {
        dot.className = "status-dot connected";
        text.innerText = "termade";
        ws.send(JSON.stringify({
          op: "hello",
          client: "web",
          since: state.seq > 0 ? state.seq : null,
          token: token || null,
          epoch: daemonEpoch
        }));
      };

      ws.onmessage = (event) => {
        try {
          const frame = JSON.parse(event.data);
          handleFrame(frame);
        } catch (e) {
          console.error("Parse error", e);
        }
      };

      ws.onclose = () => {
        dot.className = "status-dot disconnected";
        text.innerText = "已斷線，正在重試…";
        setTimeout(connect, 2000);
      };

      ws.onerror = () => ws.close();
    }

    function handleFrame(frame) {
      const op = frame.ev;
      if (op === "ready") {
        daemonEpoch = frame.epoch;
      } else if (op === "snapshot") {
        state = frame.state;
        if (!state.transcripts) state.transcripts = {};
        updateUI();
        renderActiveTranscript();
      } else if (op === "record") {
        applyRecord(frame.record);
      } else if (op === "diff") {
        renderDiff(frame.diff);
      } else if (op === "ok") {
        if (frame.note) showToast(frame.note);
      } else if (op === "error") {
        showToast(frame.message, true);
      }
    }

    function applyRecord(record) {
      state.seq = record.seq;
      const event = record.event;
      if (!event) return;
      const kind = event.kind;

      if (kind === "session_started") {
        state.sessions[event.session.id] = event.session;
        if (!state.transcripts[event.session.id]) state.transcripts[event.session.id] = [];
      } else if (kind === "session_status") {
        if (state.sessions[event.session]) {
          state.sessions[event.session].status = event.status;
        }
      } else if (kind === "session_note") {
        if (state.sessions[event.session]) {
          state.sessions[event.session].status_note = event.note;
        }
      } else if (kind === "session_removed") {
        delete state.sessions[event.session];
        delete state.transcripts[event.session];
        if (activeSession === event.session) {
          activeSession = Object.keys(state.sessions)[0] || null;
        }
      } else if (kind === "permission_requested") {
        state.pending_permissions[event.request.req] = event.request;
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      } else if (kind === "permission_resolved") {
        delete state.pending_permissions[event.req];
      } else if (kind === "task_changed") {
        state.tasks[event.task.id] = event.task;
      } else if (kind === "cost") {
        if (state.sessions[event.session]) {
          state.sessions[event.session].cost = event.cost;
        }
      } else if (kind === "user_prompt") {
        if (!state.transcripts[event.session]) state.transcripts[event.session] = [];
        state.transcripts[event.session].push(`> ${event.text}`);
        if (event.session === activeSession) appendTranscript(`> ${event.text}`, "msg-user");
      } else if (kind === "output") {
        if (!state.transcripts[event.session]) state.transcripts[event.session] = [];
        state.transcripts[event.session].push(event.text);
        if (event.session === activeSession) appendTranscript(event.text, "msg-agent");
      } else if (kind === "tool_call") {
        const icon = event.ok === true ? "✓" : (event.ok === false ? "✗" : "⏳");
        const summary = `[工具 ${event.name}] ${icon} ${event.input || ""}`;
        if (!state.transcripts[event.session]) state.transcripts[event.session] = [];
        state.transcripts[event.session].push(summary);
        if (event.session === activeSession) appendTranscript(summary, "msg-tool", event.output);
      }

      updateUI();
    }

    function appendTranscript(text, className, extraOutput = null) {
      const box = document.getElementById("transcript-box");
      const row = document.createElement("div");
      row.className = `msg-row ${className}`;
      if (extraOutput) {
        row.innerHTML = `<div>${escapeHtml(text)}</div><details><summary>詳細輸出</summary><pre style="margin-top:4px; font-size:11px;">${escapeHtml(extraOutput)}</pre></details>`;
      } else {
        row.innerText = text;
      }
      box.appendChild(row);
      box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(str) {
      return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderActiveTranscript() {
      const box = document.getElementById("transcript-box");
      box.innerHTML = "";
      if (!activeSession) return;
      const lines = state.transcripts[activeSession] || [];
      if (lines.length === 0) {
        const hint = document.createElement("div");
        hint.style.color = "var(--dim)";
        hint.style.padding = "20px 0";
        hint.style.textAlign = "center";
        hint.innerText = "尚未有逐字稿紀錄，請在下方送出 prompt 開始對話";
        box.appendChild(hint);
        return;
      }
      lines.forEach(line => {
        const row = document.createElement("div");
        if (line.startsWith("> ")) {
          row.className = "msg-row msg-user";
        } else if (line.startsWith("[工具 ")) {
          row.className = "msg-row msg-tool";
        } else {
          row.className = "msg-row msg-agent";
        }
        row.innerText = line;
        box.appendChild(row);
      });
      box.scrollTop = box.scrollHeight;
    }

    function updateUI() {
      // 1. 核准橫幅
      const pendingKeys = Object.keys(state.pending_permissions || {});
      const banner = document.getElementById("approval-banner");
      if (pendingKeys.length > 0) {
        const req = state.pending_permissions[pendingKeys[0]];
        pendingApprovalReq = req;
        document.getElementById("approval-session").innerText = req.session;
        document.getElementById("approval-detail").innerText = `${req.title}: ${req.detail}`;
        banner.style.display = "block";
      } else {
        banner.style.display = "none";
        pendingApprovalReq = null;
      }

      // 2. 統計指標與配額狀態
      let totalCost = 0;
      let liveCount = 0;
      for (const id in state.sessions) {
        const s = state.sessions[id];
        if (s.status !== "exited" && s.status !== "failed" && s.status !== "Failed" && s.status !== "Exited") liveCount++;
        if (s.cost && s.cost.usd) totalCost += s.cost.usd;
      }
      document.getElementById("stat-cost").innerText = `$${totalCost.toFixed(3)}`;
      document.getElementById("stat-live").innerText = `${liveCount} live`;

      // 3. Session 膠囊列
      const sbar = document.getElementById("session-bar");
      sbar.innerHTML = "";
      const sids = Object.keys(state.sessions);
      if (!activeSession && sids.length > 0) {
        activeSession = sids[0];
        renderActiveTranscript();
      }

      sids.forEach(id => {
        const s = state.sessions[id];
        const chip = document.createElement("div");
        chip.className = `session-chip ${id === activeSession ? "active" : ""}`;
        const st = (s.status || "").toLowerCase();
        if (st.includes("approval")) chip.classList.add("waiting");
        chip.innerText = `${s.label || id} (${s.kind || "agent"})`;
        chip.onclick = () => selectSession(id);
        sbar.appendChild(chip);
      });

      // + 建立 Session 按鈕
      const addChip = document.createElement("div");
      addChip.className = "session-chip add-btn";
      addChip.innerText = "+ 新建";
      addChip.onclick = promptNewSession;
      sbar.appendChild(addChip);

      // 4. Session 狀態橫幅 (若 Failed / Exited 顯示 Resume)
      const noticeBar = document.getElementById("session-notice-bar");
      if (activeSession && state.sessions[activeSession]) {
        const current = state.sessions[activeSession];
        const st = (current.status || "").toLowerCase();
        if (st === "failed" || st === "exited") {
          noticeBar.style.display = "flex";
          document.getElementById("session-notice-text").innerText = `${current.label || activeSession} 已結束，可點擊接續`;
        } else {
          noticeBar.style.display = "none";
        }
      } else {
        noticeBar.style.display = "none";
      }

      // 5. 任務板
      const tasksContainer = document.getElementById("tasks-container");
      tasksContainer.innerHTML = "";
      for (const tid in state.tasks || {}) {
        const t = state.tasks[tid];
        const card = document.createElement("div");
        card.className = "task-card";
        const stClass = `task-status-${(t.status || "todo").toLowerCase()}`;
        card.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-weight:bold;">${escapeHtml(t.title)}</span>
          <span class="task-badge ${stClass}" onclick="cycleTaskStatus('${t.id}', '${t.status}')">${t.status}</span>
        </div>
        <div style="color:var(--dim); font-size:11px; margin-top:6px;">${escapeHtml(t.detail || "")}</div>
        <div style="color:#666; font-size:10px; margin-top:4px;">指派：${t.assignee || "未指派"}</div>`;
        tasksContainer.appendChild(card);
      }
    }

    function selectSession(id) {
      activeSession = id;
      updateUI();
      renderActiveTranscript();
      if (currentTab === "diff") requestDiff();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".view-pane").forEach(p => p.classList.remove("active"));
      event.target.classList.add("active");
      document.getElementById(`pane-${tab}`).classList.add("active");
      if (tab === "diff") requestDiff();
    }

    function decide(decision) {
      if (!pendingApprovalReq || !ws) return;
      const decMap = { allow: "Allow", always: "Always", deny: "Deny" };
      ws.send(JSON.stringify({
        op: "permission",
        session: pendingApprovalReq.session,
        req: pendingApprovalReq.req,
        decision: decMap[decision]
      }));
    }

    function sendPrompt() {
      const input = document.getElementById("prompt-input");
      const text = input.value.trim();
      if (!text || !activeSession || !ws) return;
      const queue = document.getElementById("queue-checkbox").checked;
      ws.send(JSON.stringify({
        op: "prompt",
        session: activeSession,
        text: text,
        attachments: [],
        queue: queue
      }));
      input.value = "";
    }

    function resumeSession() {
      if (!activeSession || !ws) return;
      ws.send(JSON.stringify({
        op: "resume",
        session: activeSession,
        prompt: null
      }));
      showToast("已送出接續請求…");
    }

    function cancelTurn() {
      if (!activeSession || !ws) return;
      ws.send(JSON.stringify({ op: "cancel", session: activeSession }));
    }

    function requestDiff() {
      if (!activeSession || !ws) return;
      ws.send(JSON.stringify({ op: "worktree_diff", session: activeSession }));
    }

    function renderDiff(diffText) {
      const container = document.getElementById("diff-container");
      container.innerHTML = "";
      document.getElementById("btn-merge").style.display = diffText ? "block" : "none";
      document.getElementById("diff-info").innerText = diffText ? "變更內容 (點擊行加入註解)" : "無未合併變更";

      if (!diffText) return;

      diffText.split("\n").forEach((line, idx) => {
        const row = document.createElement("div");
        row.className = "diff-row";
        if (line.startsWith("+")) row.className += " diff-line-add";
        else if (line.startsWith("-")) row.className += " diff-line-del";
        else if (line.startsWith("diff") || line.startsWith("@@")) row.className += " diff-line-hdr";
        row.innerText = line;
        row.onclick = () => {
          const comment = prompt(`對第 ${idx + 1} 行留下審查註解：\n${line}`);
          if (comment && activeSession && ws) {
            ws.send(JSON.stringify({
              op: "review_comment",
              session: activeSession,
              location: `line:${idx + 1}`,
              comment: comment
            }));
            showToast("審查註解已送出");
          }
        };
        container.appendChild(row);
      });
    }

    function mergeDiff() {
      if (!activeSession || !ws) return;
      if (confirm("確定合併此 Session 的變更到主分支？")) {
        ws.send(JSON.stringify({ op: "worktree_merge", session: activeSession, message: null }));
      }
    }

    function promptNewSession() {
      const promptText = prompt("請輸入初始 Prompt：");
      if (!promptText || !ws) return;
      ws.send(JSON.stringify({
        op: "spawn",
        kind: "opencode",
        prompt: promptText,
        role: "worker",
        worktree: false,
        transport: "auto"
      }));
      showToast("正在建立新 Session…");
    }

    function promptNewTask() {
      const title = prompt("任務標題：");
      if (!title || !ws) return;
      const detail = prompt("任務說明 (可選)：") || "";
      ws.send(JSON.stringify({
        op: "task_create",
        title: title,
        detail: detail,
        assignee: activeSession,
        created_by: null,
        depends_on: []
      }));
      showToast("正在建立任務…");
    }

    function cycleTaskStatus(taskId, currentStatus) {
      if (!ws) return;
      const cycle = {
        Todo: "Doing",
        Doing: "Done",
        Done: "Todo",
        Blocked: "Doing",
        Review: "Done"
      };
      const next = cycle[currentStatus] || "Doing";
      ws.send(JSON.stringify({
        op: "task_update",
        id: taskId,
        status: next
      }));
    }

    connect();
  </script>
</body>
</html>
