        model: manageSessionState.model || null,
        effort: manageSessionState.effort || null
      }));
      closeSheet("sheet-session-manage");
      showToast("已更新 Session 模型與推理設定");
    }

    function submitSetBudget() {
      if (!targetManageSessionId || !ws) return;
      const val = parseFloat(document.getElementById("manage-budget").value);
      if (isNaN(val) || val <= 0) return;
      ws.send(JSON.stringify({
        op: "session_budget",
        session: targetManageSessionId,
        budget_usd: val
      }));
      closeSheet("sheet-session-manage");
      showToast(`已調整預算上限為 $${val.toFixed(2)}`);
    }

    function submitHandoff() {
      if (!targetManageSessionId || !ws) return;
      const note = document.getElementById("handoff-note").value.trim() || null;
      ws.send(JSON.stringify({
        op: "handoff",
        session: targetManageSessionId,
        kind: manageSessionState.handoffKind,
        note: note
      }));
      closeSheet("sheet-session-manage");
      showToast("已送出交接請求…");
    }

    function toggleSleepCurrent() {
      if (!targetManageSessionId || !ws) return;
      const s = state.sessions[targetManageSessionId] || {};
      const isSleeping = (s.status || "").toLowerCase() === "sleeping";
      if (isSleeping) {
        ws.send(JSON.stringify({ op: "wake", session: targetManageSessionId }));
        showToast("已發送喚醒請求");
      } else {
        ws.send(JSON.stringify({ op: "sleep", session: targetManageSessionId }));
        showToast("已發送休眠請求");
      }
      closeSheet("sheet-session-manage");
    }

    function killCurrentSession() {
      if (!targetManageSessionId || !ws) return;
      if (window.confirm("確定強制結束此 Agent 子處理程序 (Kill)？")) {
        ws.send(JSON.stringify({ op: "kill", session: targetManageSessionId }));
        closeSheet("sheet-session-manage");
        showToast("已發送強制結束訊號");
      }
    }

    function removeCurrentSession() {
      if (!targetManageSessionId || !ws) return;
      if (window.confirm("確定從清單中移除此 Session？")) {
        ws.send(JSON.stringify({ op: "session_remove", session: targetManageSessionId, force: true }));
        closeSheet("sheet-session-manage");
        showToast("已送出移除請求");
      }
    }

    function openQueueManageSheet() {
      const container = document.getElementById("queue-items-container");
      container.innerHTML = "";
      const qItems = (state.queues && state.queues[activeSession]) ? state.queues[activeSession] : [];
      if (qItems.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:var(--text-dim); padding:10px;">目前佇列為空</div>`;
      } else {
        qItems.forEach((text, idx) => {
          const item = document.createElement("div");
          item.style.cssText = "background:#0d0e14; border:1px solid var(--border); padding:8px 10px; border-radius:6px; font-size:12px; font-family:var(--font-mono); color:var(--text);";
          item.innerText = `${idx + 1}. ${text}`;
          container.appendChild(item);
        });
      }
      openSheet("sheet-queue-manage");
    }

    function submitClearQueue() {
      if (!activeSession || !ws) return;
      ws.send(JSON.stringify({ op: "queue_clear", session: activeSession }));
      closeSheet("sheet-queue-manage");
      showToast("已清空待送佇列");
    }

    function openNewTaskSheet() {
      document.getElementById("sheet-task-title").value = "";
      document.getElementById("sheet-task-detail").value = "";
      openSheet("sheet-new-task");
    }
    function submitNewTask() {
      const title = document.getElementById("sheet-task-title").value.trim();
      if (!title || !ws) return;
      const detail = document.getElementById("sheet-task-detail").value.trim();
      ws.send(JSON.stringify({
        op: "task_create",
        title: title,
        detail: detail,
        assignee: activeSession,
        created_by: null,
        depends_on: []
      }));
      closeSheet("sheet-new-task");
      showToast("已建立協作任務");
    }
    function cycleTaskStatus(taskId, currentStatus) {
      if (!ws) return;
      const cycle = { Todo: "Doing", Doing: "Done", Done: "Todo", Blocked: "Doing", Review: "Done" };
      const next = cycle[currentStatus] || "Doing";
      ws.send(JSON.stringify({ op: "task_update", id: taskId, status: next }));
    }

    function openReviewCommentSheet(lineNum, lineContent) {
      pendingReviewLine = lineNum;
      document.getElementById("sheet-review-preview").innerText = `第 ${lineNum} 行：${lineContent}`;
      document.getElementById("sheet-review-text").value = "";
      openSheet("sheet-review-comment");
    }
    function submitReviewComment() {
      const comment = document.getElementById("sheet-review-text").value.trim();
      if (!comment || !activeSession || !ws) return;
      ws.send(JSON.stringify({
        op: "review_comment",
        session: activeSession,
        location: `line:${pendingReviewLine}`,
        comment: comment
      }));
      closeSheet("sheet-review-comment");
      showToast("已送交審查意見給 Agent");
    }

    const promptTextarea = document.getElementById("prompt-textarea");
    promptTextarea.addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height = (this.scrollHeight) + "px";
    });

    connect();
  </script>
</body>
</html>
