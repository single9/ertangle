<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <title>termade companion</title>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: #13151f;
      --card-hover: #1a1c29;
      --border: #232636;
      --border-subtle: #191b26;
      --text: #f1f3f9;
      --text-dim: #82899d;
      --text-muted: #52576b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --cyan: #06b6d4;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    /* 頂部應用程式導覽列 */
    header {
      background: rgba(14, 16, 24, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: calc(env(safe-area-inset-top, 0px) + 8px) 14px 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 20;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
    }
    .status-dot.connected { background: var(--green); box-shadow: 0 0 8px rgba(16, 185, 129, 0.5); }
    .status-dot.connecting { background: var(--yellow); }
    .status-dot.disconnected { background: var(--red); }
    .session-title-wrap {
      display: flex;
      flex-direction: column;
    }
    .session-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .session-sub {
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-dim);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .icon-btn:active { background: var(--card-hover); color: var(--text); }
    .cost-badge {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--cyan);
    }

    /* 搜尋列 */
    #search-bar-wrap {
      background: #11131c;
      border-bottom: 1px solid var(--border);
      padding: 6px 14px;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    /* 主要內容視圖 */
    main {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      -webkit-overflow-scrolling: touch;
    }
    .tab-view {
      display: none;
      height: 100%;
      flex-direction: column;
    }
    .tab-view.active {
      display: flex;
    }

    /* 置頂緊急核准卡片 */
    .urgent-banner {
      background: linear-gradient(135deg, #2b1f05 0%, #171306 100%);
      border-bottom: 2px solid var(--yellow);
      padding: 12px 14px;
      flex-shrink: 0;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    .urgent-title {
      font-weight: 600;
      font-size: 13px;
      color: var(--yellow);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .urgent-desc {
      font-size: 12px;
      color: #fff;
      font-family: var(--font-mono);
      background: rgba(0,0,0,0.4);
      padding: 6px 8px;
      border-radius: 6px;
      margin-bottom: 10px;
      word-break: break-all;
    }
    .btn-row { display: flex; gap: 8px; }
    .btn-pill {
      flex: 1;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-allow { background: var(--green); color: #000; }
    .btn-always { background: var(--cyan); color: #000; }
    .btn-deny { background: var(--red); color: #fff; }

    /* 對話視圖 (Chat) */
    #chat-transcript {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .bubble {
      max-width: 88%;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      position: relative;
    }
    .bubble-user {
      align-self: flex-end;
      background: #1e3a8a;
      color: #f8fafc;
      border-radius: 18px 18px 4px 18px;
      box-shadow: 0 2px 6px rgba(30, 58, 138, 0.25);
    }
    .bubble-agent {
      align-self: flex-start;
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 18px 18px 18px 4px;
    }
    .bubble pre {
      background: rgba(0,0,0,0.3);
      padding: 8px 10px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      overflow-x: auto;
      margin: 6px 0;
    }
    .bubble code {
      font-family: var(--font-mono);
      font-size: 12px;
      background: rgba(0,0,0,0.3);
      padding: 1px 4px;
      border-radius: 4px;
    }

    /* 工具卡片 */
    .tool-chip {
      align-self: flex-start;
      width: 100%;
      background: #10121a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
    }
    .tool-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .tool-name {
      font-weight: 600;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
    }
    .tool-body {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.06);
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      white-space: pre-wrap;
      max-height: 180px;
      overflow-y: auto;
    }

    /* 對話輸入區域 */
    #chat-composer {
      background: rgba(14, 16, 24, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      padding: 8px 12px calc(env(safe-area-inset-bottom, 0px) + 8px) 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .composer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }
    .toggle-pill {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 3px 8px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
    }
    .toggle-pill.active {
      background: #1a2738;
      border-color: var(--cyan);
      color: var(--cyan);
      font-weight: 600;
    }
    .composer-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    #prompt-textarea {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 8px 14px;
      font-family: var(--font-sans);
      font-size: 14px;
      color: var(--text);
      resize: none;
      min-height: 38px;
      max-height: 120px;
      line-height: 1.4;
      outline: none;
      transition: border-color 0.2s;
    }
    #prompt-textarea:focus { border-color: var(--cyan); }
    .btn-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-send { background: var(--cyan); color: #000; }
    .btn-cancel-round { background: #2a1b1e; color: var(--red); border: 1px solid #4a2128; }

    /* 接續醒目標示 */
    .resume-strip {
      background: #241c09;
      border: 1px solid var(--yellow);
      border-radius: 8px;
      padding: 8px 12px;
      margin: 8px 14px;
      display: none;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--yellow);
    }

    /* 審核視圖 (Approval & Diff) */
    .review-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .section-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .diff-line {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 2px 4px;
      white-space: pre-wrap;
      word-break: break-all;
      cursor: pointer;
    }
    .diff-add { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .diff-del { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .diff-hdr { color: var(--cyan); font-weight: 600; }

    /* 任務板視圖 (Tasks) */
    .tasks-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .filter-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-chip {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 12px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .filter-chip.active {
      background: #182333;
      border-color: var(--cyan);
      color: var(--cyan);
      font-weight: 600;
    }
    .task-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .task-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .task-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .task-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 10px;
      cursor: pointer;
      font-family: var(--font-mono);
    }
    .st-todo { background: #2e2609; color: var(--yellow); border: 1px solid var(--yellow); }
    .st-doing { background: #0c2b1a; color: var(--green); border: 1px solid var(--green); }
    .st-done { background: #1c1d24; color: var(--text-dim); text-decoration: line-through; }

    /* Session 切換視圖 (Sessions) */
    .sessions-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .quota-card {
      background: linear-gradient(135deg, #131929 0%, #0d121c 100%);
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 12px;
    }
    .quota-title {
      font-weight: 600;
      color: var(--cyan);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .session-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .session-item.active {
      border-color: var(--cyan);
      background: #111a26;
    }
    .session-info-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .session-name {
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .session-meta {
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }
    .session-actions-btn {
      padding: 4px 8px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      font-size: 11px;
      cursor: pointer;
    }

    /* 底部導覽列 (Bottom Navigation Bar) */
    nav {
      background: rgba(14, 16, 24, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      display: flex;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      flex-shrink: 0;
      z-index: 20;
    }
    .nav-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 8px 0 6px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      position: relative;
    }
    .nav-btn.active {
      color: var(--cyan);
      font-weight: 600;
    }
    .nav-svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav-badge {
      position: absolute;
      top: 6px;
      right: calc(50% - 14px);
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--yellow);
    }

    /* 底部滑出抽屜 (Bottom Sheet) */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 50;
    }
    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .sheet-container {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #141620;
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 16px 18px calc(env(safe-area-inset-bottom, 0px) + 16px) 18px;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
      z-index: 51;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 88vh;
      overflow-y: auto;
    }
    .sheet-backdrop.open .sheet-container {
      transform: translateY(0);
    }
    .sheet-handle {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: #373c4f;
      align-self: center;
      margin-bottom: 4px;
    }
    .sheet-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-label {
      font-size: 12px;
      color: var(--text-dim);
      font-weight: 500;
    }
    .sheet-input {
      width: 100%;
      background: #0d0e14;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--text);
      outline: none;
    }
    .sheet-input:focus { border-color: var(--cyan); }
    .sheet-select {
      background: #0d0e14;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--text);
      outline: none;
    }
    .sheet-btn-row {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    .btn-action {
      flex: 1;
      background: var(--cyan);
      color: #000;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      padding: 11px 0;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-secondary {
      background: var(--card-hover);
      color: var(--text-dim);
      border: 1px solid var(--border);
    }
    .btn-danger-outline {
      background: transparent;
      border: 1px solid var(--red);
      color: var(--red);
    }

    /* 浮層 Toast */
    #toast {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 52px);
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(20, 22, 32, 0.95);
      border: 1px solid var(--border);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      pointer-events: none;
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 100;
      white-space: nowrap;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #toast.error {
      border-color: var(--red);
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 頂部導覽列 -->
    <header>
      <div class="header-left" onclick="switchNavTab('sessions')">
        <span id="conn-dot" class="status-dot"></span>
        <div class="session-title-wrap">
          <div class="session-title">
            <span id="header-label">termade</span>
            <span style="font-size:10px; color:var(--text-dim);">▾</span>
          </div>
          <div id="header-sub" class="session-sub">連線中…</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="toggleSearchBar()" title="搜尋逐字稿">
          <svg class="nav-svg" style="width:16px; height:16px;" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
        <button class="icon-btn" onclick="openCurrentSessionSettings()" title="Session 設定">
          <svg class="nav-svg" style="width:16px; height:16px;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>

  <script>
    // 1. 初始化 Token
    let token = "";
    const hash = window.location.hash.substring(1);
    const hashParams = new URLSearchParams(hash);
    if (hashParams.has("token")) {
      token = hashParams.get("token");
      localStorage.setItem("termade_token", token);
      window.location.hash = "";
    } else {
      token = localStorage.getItem("termade_token") || "";
    }

    let ws = null;
    let state = {
      sessions: {},
      tasks: {},
      pending_permissions: {},
      transcripts: {},
      quotas: {},
      seq: 0
    };
    let activeSession = null;
    let currentTab = "chat";
    let daemonEpoch = null;
    let pendingApprovalReq = null;
    let queueMode = false;
    let taskFilter = "all";
    let pendingReviewLine = null;

    // Toast 浮層
    function showToast(msg, isError = false) {
      const t = document.getElementById("toast");
      t.innerText = msg;
      t.className = `show ${isError ? "error" : ""}`;
      setTimeout(() => { t.className = ""; }, 2500);
    }

    // WebSocket 連線
    function connect() {
      const dot = document.getElementById("conn-dot");
      const sub = document.getElementById("header-sub");
      dot.className = "status-dot connecting";
      sub.innerText = "連線中…";

      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

      ws.onopen = () => {
        dot.className = "status-dot connected";
        sub.innerText = "已連線";
        ws.send(JSON.stringify({
          op: "hello",
          client: "web",
          since: state.seq > 0 ? state.seq : null,
          token: token || null,
          epoch: daemonEpoch
        }));
      };

      ws.onmessage = (event) => {
        try {
          const frame = JSON.parse(event.data);
          handleFrame(frame);
        } catch (e) {
          console.error("Frame parse error:", e);
        }
      };

      ws.onclose = () => {
        dot.className = "status-dot disconnected";
        sub.innerText = "斷線重試中…";
        setTimeout(connect, 2000);
      };

      ws.onerror = () => ws.close();
    }

    function handleFrame(frame) {
      const op = frame.ev;
      if (op === "ready") {
        daemonEpoch = frame.epoch;
      } else if (op === "snapshot") {
        state = frame.state;
        if (!state.transcripts) state.transcripts = {};
        updateAllViews();
      } else if (op === "record") {
        applyRecord(frame.record);
      } else if (op === "diff") {
        renderDiff(frame.diff);
      } else if (op === "ok") {
        if (frame.note) showToast(frame.note);
      } else if (op === "error") {
        showToast(frame.message, true);
      }
    }

    function applyRecord(record) {
      state.seq = record.seq;
      const event = record.event;
      if (!event) return;
      const kind = event.kind;

      if (kind === "session_started") {
        state.sessions[event.session.id] = event.session;
        if (!state.transcripts[event.session.id]) state.transcripts[event.session.id] = [];
      } else if (kind === "session_status") {
        if (state.sessions[event.session]) {
          state.sessions[event.session].status = event.status;
        }
      } else if (kind === "session_model") {
        if (state.sessions[event.session]) {
          state.sessions[event.session].model = event.model;
        }
      } else if (kind === "session_effort") {
        if (state.sessions[event.session]) {
          state.sessions[event.session].effort = event.effort;
        }
      } else if (kind === "session_note") {
        if (state.sessions[event.session]) {
          state.sessions[event.session].status_note = event.note;
        }
      } else if (kind === "session_removed") {
        delete state.sessions[event.session];
        delete state.transcripts[event.session];
        if (activeSession === event.session) {
          activeSession = Object.keys(state.sessions)[0] || null;
        }
      } else if (kind === "permission_requested") {
        state.pending_permissions[event.request.req] = event.request;
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      } else if (kind === "permission_resolved") {
        delete state.pending_permissions[event.req];
      } else if (kind === "task_changed") {
        state.tasks[event.task.id] = event.task;
      } else if (kind === "quota_updated") {
        if (!state.quotas) state.quotas = {};
        state.quotas[event.quota.agent] = event.quota;
      } else if (kind === "cost") {
        if (state.sessions[event.session]) {
          state.sessions[event.session].cost = event.cost;
        }
      } else if (kind === "user_prompt") {
        if (!state.transcripts[event.session]) state.transcripts[event.session] = [];
        state.transcripts[event.session].push(`> ${event.text}`);
        if (event.session === activeSession) appendBubble(`> ${event.text}`, true);
      } else if (kind === "output") {
        if (!state.transcripts[event.session]) state.transcripts[event.session] = [];
        state.transcripts[event.session].push(event.text);
        if (event.session === activeSession) appendBubble(event.text, false);
      } else if (kind === "tool_call") {
        const icon = event.ok === true ? "✓" : (event.ok === false ? "✗" : "…");
        const summary = `[工具 ${event.name}] ${icon} ${event.input || ""}`;
        if (!state.transcripts[event.session]) state.transcripts[event.session] = [];
        state.transcripts[event.session].push(summary);
        if (event.session === activeSession) appendToolChip(event.name, icon, event.input, event.output);
      }

      updateAllViews();
    }

    function appendBubble(rawText, isUser) {
      const box = document.getElementById("chat-transcript");
      const bubble = document.createElement("div");
      bubble.className = `bubble ${isUser ? "bubble-user" : "bubble-agent"}`;
      bubble.innerHTML = renderSimpleMarkdown(rawText);
      box.appendChild(bubble);
      box.scrollTop = box.scrollHeight;
    }

    function appendToolChip(name, icon, input, output) {
      const box = document.getElementById("chat-transcript");
      const chip = document.createElement("div");
      chip.className = "tool-chip";
      chip.innerHTML = `
        <div class="tool-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
          <span class="tool-name">[工具] ${escapeHtml(name)}</span>
          <span style="font-size:11px; color:var(--text-dim);">${icon} 詳細 ▾</span>
        </div>
        <div class="tool-body" style="display:none;">${escapeHtml(input || "")}\n\n${escapeHtml(output || "無進一步輸出")}</div>
      `;
      box.appendChild(chip);
      box.scrollTop = box.scrollHeight;
    }

    function renderSimpleMarkdown(text) {
      let safe = escapeHtml(text || "");
      safe = safe.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (match, lang, code) => `<pre><code>${code}</code></pre>`);
      safe = safe.replace(/`([^`]+)`/g, "<code>$1</code>");
      safe = safe.replace(/\n/g, "<br>");
      return safe;
    }

    function escapeHtml(str) {
      return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function updateAllViews() {
      const sids = Object.keys(state.sessions);
      if (!activeSession && sids.length > 0) activeSession = sids[0];

      // 1. 頂部狀態列
      const current = activeSession ? state.sessions[activeSession] : null;
      document.getElementById("header-label").innerText = current ? (current.label || activeSession) : "termade";
      if (current) {
        document.getElementById("header-sub").innerText = `${current.kind || "agent"}${current.model ? " (" + current.model + ")" : ""} • ${current.status || "idle"}`;
      }
      let totalCost = 0;
      for (const id in state.sessions) {
        const s = state.sessions[id];
        if (s.cost && s.cost.usd) totalCost += s.cost.usd;
      }
      document.getElementById("header-cost").innerText = `$${totalCost.toFixed(2)}`;

      // 2. 審查橫幅
      const pendingKeys = Object.keys(state.pending_permissions || {});
      const urgentBanner = document.getElementById("urgent-approval-banner");
      const navBadge = document.getElementById("nav-review-badge");
      const reviewSlot = document.getElementById("review-approval-slot");

      if (pendingKeys.length > 0) {
        const req = state.pending_permissions[pendingKeys[0]];
        pendingApprovalReq = req;
        urgentBanner.style.display = "block";
        navBadge.style.display = "block";
        document.getElementById("urgent-session-id").innerText = req.session;
        document.getElementById("urgent-detail").innerText = `${req.title}：${req.detail}`;

        reviewSlot.innerHTML = `
          <div style="background:#221804; border:1px solid var(--yellow); padding:10px 12px; border-radius:8px;">
            <div style="color:var(--yellow); font-weight:600; margin-bottom:4px;">${escapeHtml(req.title)}</div>
            <div style="font-family:var(--font-mono); font-size:12px; margin-bottom:8px;">${escapeHtml(req.detail)}</div>
            <div class="btn-row">
              <button class="btn-pill btn-allow" onclick="submitPermission('Allow')">Allow</button>
              <button class="btn-pill btn-always" onclick="submitPermission('Always')">Always</button>
              <button class="btn-pill btn-deny" onclick="submitPermission('Deny')">Deny</button>
            </div>
          </div>
        `;
      } else {
        urgentBanner.style.display = "none";
        navBadge.style.display = "none";
        pendingApprovalReq = null;
        reviewSlot.innerHTML = `<span style="color:var(--text-dim);">目前無等待核准的操作。</span>`;
      }

      // 3. 逐字稿重繪 (若當前為 chat)
      if (currentTab === "chat") {
        renderCurrentChatTranscript();
      }

      // 4. Session 狀態與接續提示
      const resumeStrip = document.getElementById("resume-strip");
      const cancelBtn = document.getElementById("btn-cancel");
      if (current) {
        const st = (current.status || "").toLowerCase();
        if (st === "failed" || st === "exited") {
          resumeStrip.style.display = "flex";
          cancelBtn.style.display = "none";
        } else {
          resumeStrip.style.display = "none";
          cancelBtn.style.display = (st === "busy") ? "flex" : "none";
        }
      } else {
        resumeStrip.style.display = "none";
        cancelBtn.style.display = "none";
      }

      // 5. 任務板渲染
      renderTasksList();

      // 6. Session 列表渲染
      renderSessionsList();

      // 7. 額度資訊
      renderQuota();
    }

    function renderCurrentChatTranscript() {
      const box = document.getElementById("chat-transcript");
      box.innerHTML = "";
      if (!activeSession) {
        box.innerHTML = `<div style="text-align:center; color:var(--text-dim); margin-top:30px;">尚無可用 Session，點擊右下角「Session」建立新對話</div>`;
        return;
      }
      const lines = state.transcripts[activeSession] || [];
      if (lines.length === 0) {
        box.innerHTML = `<div style="text-align:center; color:var(--text-dim); margin-top:30px;">尚無對話紀錄，請在下方輸入 Prompt 開始互動</div>`;
        return;
      }

      lines.forEach(line => {
        if (line.startsWith("> ")) {
          appendBubble(line.substring(2), true);
        } else {
          appendBubble(line, false);
        }
      });
      box.scrollTop = box.scrollHeight;
    }

    function filterTranscript() {
      const query = document.getElementById("search-keyword").value.toLowerCase().trim();
      const bubbles = document.querySelectorAll("#chat-transcript .bubble");
      bubbles.forEach(b => {
        if (!query || b.innerText.toLowerCase().includes(query)) {
          b.style.display = "";
        } else {
          b.style.display = "none";
        }
      });
    }

    function toggleSearchBar() {
      const wrap = document.getElementById("search-bar-wrap");
      const isVisible = wrap.style.display === "flex";
      wrap.style.display = isVisible ? "none" : "flex";
      if (!isVisible) {
        document.getElementById("search-keyword").focus();
      } else {
        document.getElementById("search-keyword").value = "";
        filterTranscript();
      }
    }

    function renderTasksList() {
      const container = document.getElementById("tasks-list");
      container.innerHTML = "";
      const taskKeys = Object.keys(state.tasks || {});
      if (taskKeys.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:var(--text-dim); margin-top:20px;">目前尚無協作任務</div>`;
        return;
      }

      taskKeys.forEach(id => {
        const t = state.tasks[id];
        const st = (t.status || "todo").toLowerCase();
        if (taskFilter !== "all" && st !== taskFilter) return;

        const card = document.createElement("div");
        card.className = "task-card";
        const badgeClass = st === "done" ? "st-done" : (st === "doing" ? "st-doing" : "st-todo");
        card.innerHTML = `
          <div class="task-top">
            <span class="task-title">${escapeHtml(t.title)}</span>
            <span class="task-badge ${badgeClass}" onclick="cycleTaskStatus('${t.id}', '${t.status}')">${t.status}</span>
          </div>
          ${t.detail ? `<div style="font-size:12px; color:var(--text-dim);">${escapeHtml(t.detail)}</div>` : ""}
          <div style="font-size:10px; color:#666;">指派：${t.assignee || "未指派"}</div>
        `;
        container.appendChild(card);
      });
    }

    function setTaskFilter(filter, el) {
      taskFilter = filter;
      document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
      el.classList.add("active");
      renderTasksList();
    }

    function renderSessionsList() {
      const container = document.getElementById("sessions-list");
      container.innerHTML = "";
      const sids = Object.keys(state.sessions);
      if (sids.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:var(--text-dim); margin-top:20px;">目前尚無任何 Session</div>`;
        return;
      }

      sids.forEach(id => {
        const s = state.sessions[id];
        const item = document.createElement("div");
        item.className = `session-item ${id === activeSession ? "active" : ""}`;
        const costStr = s.cost && s.cost.usd ? `$${s.cost.usd.toFixed(2)}` : "$0.00";
        item.innerHTML = `
          <div class="session-info-left" onclick="selectSession('${id}')">
            <div class="session-name">
              <span>●</span>
              <span>${escapeHtml(s.label || id)}</span>
            </div>
            <div class="session-meta">${s.kind || "agent"}${s.model ? " (" + s.model + ")" : ""} • ${s.status || "idle"}</div>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <div style="font-family:var(--font-mono); font-size:12px; color:var(--cyan);">${costStr}</div>
            <button class="session-actions-btn" onclick="openSessionSettings('${id}')">設定</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function renderQuota() {
      const qc = document.getElementById("quota-container");
      if (!state.quotas || Object.keys(state.quotas).length === 0) {
        qc.style.display = "none";
        return;
      }
      qc.style.display = "block";
      qc.innerHTML = "";
      for (const k in state.quotas) {
        const q = state.quotas[k];
        const card = document.createElement("div");
        card.className = "quota-card";
        card.innerHTML = `
          <div class="quota-title">
            <span>${escapeHtml(q.agent || k)} 額度指標</span>
            <span>${q.pct != null ? q.pct + "%" : "正常"}</span>
          </div>
          <div style="color:var(--text-dim); font-size:11px;">重置時間：${q.reset_at || "未設定"}</div>
        `;
        qc.appendChild(card);
      }
    }

    function selectSession(id) {
      activeSession = id;
      switchNavTab("chat");
    }

    function switchNavTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll(".tab-view").forEach(v => v.classList.remove("active"));
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));

      const targetView = document.getElementById(`view-${tabName}`);
      if (targetView) targetView.classList.add("active");

      const navIndices = { chat: 0, review: 1, tasks: 2, sessions: 3 };
      const navBtns = document.querySelectorAll(".nav-btn");
      if (navBtns[navIndices[tabName]]) navBtns[navIndices[tabName]].classList.add("active");

      if (tabName === "chat") {
        renderCurrentChatTranscript();
      } else if (tabName === "review") {
        requestDiff();
      }
    }

    function sendPrompt() {
      const textarea = document.getElementById("prompt-textarea");
      const text = textarea.value.trim();
      if (!text || !activeSession || !ws) return;

      ws.send(JSON.stringify({
        op: "prompt",
        session: activeSession,
        text: text,
        attachments: [],
        queue: queueMode
      }));
      textarea.value = "";
      textarea.style.height = "auto";
    }

    function toggleQueue() {
      queueMode = !queueMode;
      const el = document.getElementById("queue-toggle");
      el.className = `toggle-pill ${queueMode ? "active" : ""}`;
      showToast(queueMode ? "已開啟：忙碌時排入佇列" : "已關閉佇列模式");
    }

    function cancelTurn() {
      if (!activeSession || !ws) return;
      ws.send(JSON.stringify({ op: "cancel", session: activeSession }));
      showToast("已發送中斷請求…");
    }

    function resumeCurrentSession() {
      if (!activeSession || !ws) return;
      ws.send(JSON.stringify({
        op: "resume",
        session: activeSession,
        prompt: null
      }));
      showToast("正在接續原對話…");
    }

    function submitPermission(decision) {
      if (!pendingApprovalReq || !ws) return;
      ws.send(JSON.stringify({
        op: "permission",
        session: pendingApprovalReq.session,
        req: pendingApprovalReq.req,
        decision: decision
      }));
      showToast(`已送出核准：${decision}`);
    }

    function requestDiff() {
      if (!activeSession || !ws) return;
      ws.send(JSON.stringify({ op: "worktree_diff", session: activeSession }));
    }

    function renderDiff(diffText) {
      const container = document.getElementById("diff-lines-container");
      container.innerHTML = "";
      const statusText = document.getElementById("diff-status-text");
      const mergeBtn = document.getElementById("btn-merge-diff");
      const prBtn = document.getElementById("btn-pr-diff");

      if (!diffText || diffText.trim().length === 0) {
        statusText.innerText = "目前工作區無未合併變更。";
        mergeBtn.style.display = "none";
        prBtn.style.display = "none";
        return;
      }

      statusText.innerText = "變更內容 (點擊行加入註解)：";
      mergeBtn.style.display = "block";
      prBtn.style.display = "block";

      diffText.split("\n").forEach((line, idx) => {
        const row = document.createElement("div");
        row.className = "diff-line";
        if (line.startsWith("+")) row.classList.add("diff-add");
        else if (line.startsWith("-")) row.classList.add("diff-del");
        else if (line.startsWith("@@") || line.startsWith("diff")) row.classList.add("diff-hdr");
        row.innerText = line;
        row.onclick = () => openReviewCommentSheet(idx + 1, line);
        container.appendChild(row);
      });
    }

    function confirmMerge() {
      if (!activeSession || !ws) return;
      if (window.confirm("確定合併此 Session 的變更到主分支？")) {
        ws.send(JSON.stringify({ op: "worktree_merge", session: activeSession, message: null }));
        showToast("已送出 Worktree 合併請求");
      }
    }

    function openPrSheet() {
      document.getElementById("pr-title").value = "";
      document.getElementById("pr-body").value = "";
      openSheet("sheet-create-pr");
    }
    function submitCreatePr() {
      const title = document.getElementById("pr-title").value.trim();
      if (!title || !activeSession || !ws) return;
      const body = document.getElementById("pr-body").value.trim();
      ws.send(JSON.stringify({
        op: "worktree_pr",
        session: activeSession,
        title: title,
        body: body
      }));
      closeSheet("sheet-create-pr");
      showToast("已送出建立 PR 請求…");
    }

    // 抽屜控制
    function openSheet(id) { document.getElementById(id).classList.add("open"); }
    function closeSheet(id) { document.getElementById(id).classList.remove("open"); }
    function closeSheetOnBackdrop(e, el) { if (e.target === el) el.classList.remove("open"); }

    // 建立新 Session 抽屜控制與模型晶片推薦
    const modelPresets = {
      claude: ["claude-3-7-sonnet", "claude-3-5-sonnet", "claude-3-5-haiku", "claude-3-opus"],
      antigravity: ["gemini-2.5-pro", "gemini-2.5-flash", "claude-3-7-sonnet"],
      codex: ["o3-mini", "o1", "gpt-4o"],
      opencode: ["default", "claude-3-7-sonnet", "gemini-2.5-pro"]
    };

    function onKindChanged(kind) {
      const chipsContainer = document.getElementById("model-chips");
      chipsContainer.innerHTML = "";
      const models = modelPresets[kind] || [];
      models.forEach(m => {
        const chip = document.createElement("span");
        chip.style.cssText = "font-size:11px; font-family:var(--font-mono); background:var(--card-bg); border:1px solid var(--border); padding:2px 8px; border-radius:10px; cursor:pointer;";
        chip.innerText = m;
        chip.onclick = () => { document.getElementById("new-model").value = m; };
        chipsContainer.appendChild(chip);
      });
    }

    function openNewSessionSheet() {
      document.getElementById("new-label").value = "";
      document.getElementById("new-model").value = "";
      document.getElementById("new-budget").value = "";
      document.getElementById("new-prompt").value = "";
      document.getElementById("new-worktree").checked = false;
      onKindChanged(document.getElementById("new-kind").value);
      openSheet("sheet-new-session");
    }

    function submitDetailedSession() {
      const promptText = document.getElementById("new-prompt").value.trim();
      if (!promptText || !ws) return;

      const kind = document.getElementById("new-kind").value;
      const label = document.getElementById("new-label").value.trim() || null;
      const model = document.getElementById("new-model").value.trim() || null;
      const effort = document.getElementById("new-effort").value || null;
      const permission = document.getElementById("new-permission").value || null;
      const budgetVal = parseFloat(document.getElementById("new-budget").value);
      const budgetUsd = !isNaN(budgetVal) && budgetVal > 0 ? budgetVal : null;
      const worktree = document.getElementById("new-worktree").checked;

      ws.send(JSON.stringify({
        op: "spawn",
        kind: kind,
        label: label,
        model: model,
        effort: effort,
        permission: permission,
        budget_usd: budgetUsd,
        worktree: worktree,
        prompt: promptText,
        role: "worker",
        transport: "auto"
      }));
      closeSheet("sheet-new-session");
      showToast("已建立新 Agent Session…");
    }

    // Session 詳情面板操作
    let targetManageSessionId = null;
    function openCurrentSessionSettings() {
      if (activeSession) openSessionSettings(activeSession);
    }
    function openSessionSettings(sessionId) {
      targetManageSessionId = sessionId;
      const s = state.sessions[sessionId] || {};
      document.getElementById("manage-session-title").innerText = `${s.label || sessionId} 管理面板`;
      document.getElementById("manage-model").value = s.model || "";
      document.getElementById("manage-effort").value = s.effort || "";
      document.getElementById("manage-budget").value = s.budget_usd || "";
      openSheet("sheet-session-manage");
    }

    function submitSwitchModel() {
      if (!targetManageSessionId || !ws) return;
      const model = document.getElementById("manage-model").value.trim() || null;
      const effort = document.getElementById("manage-effort").value || null;
      ws.send(JSON.stringify({
        op: "session_config",
        session: targetManageSessionId,
        model: model,
        effort: effort
      }));
      closeSheet("sheet-session-manage");
      showToast("已更新 Session 模型與推理設定");
    }

    function submitSetBudget() {
      if (!targetManageSessionId || !ws) return;
      const val = parseFloat(document.getElementById("manage-budget").value);
      if (isNaN(val) || val <= 0) return;
      ws.send(JSON.stringify({
        op: "session_budget",
        session: targetManageSessionId,
        budget_usd: val
      }));
      closeSheet("sheet-session-manage");
      showToast(`已調整預算上限為 $${val.toFixed(2)}`);
    }

    function submitHandoff() {
      if (!targetManageSessionId || !ws) return;
      const kind = document.getElementById("handoff-kind").value;
      const note = document.getElementById("handoff-note").value.trim() || null;
      ws.send(JSON.stringify({
        op: "handoff",
        session: targetManageSessionId,
        kind: kind,
        note: note
      }));
      closeSheet("sheet-session-manage");
      showToast("已送出交接請求…");
    }

    function toggleSleepCurrent() {
      if (!targetManageSessionId || !ws) return;
      const s = state.sessions[targetManageSessionId] || {};
      const isSleeping = (s.status || "").toLowerCase() === "sleeping";
      if (isSleeping) {
        ws.send(JSON.stringify({ op: "wake", session: targetManageSessionId }));
        showToast("已發送喚醒請求");
      } else {
        ws.send(JSON.stringify({ op: "sleep", session: targetManageSessionId }));
        showToast("已發送休眠請求");
      }
      closeSheet("sheet-session-manage");
    }

    function killCurrentSession() {
      if (!targetManageSessionId || !ws) return;
      if (window.confirm("確定強制結束此 Agent 子處理程序 (Kill)？")) {
        ws.send(JSON.stringify({ op: "kill", session: targetManageSessionId }));
        closeSheet("sheet-session-manage");
        showToast("已發送強制結束訊號");
      }
    }

    function removeCurrentSession() {
      if (!targetManageSessionId || !ws) return;
      if (window.confirm("確定從清單中移除此 Session？")) {
        ws.send(JSON.stringify({ op: "session_remove", session: targetManageSessionId, force: true }));
        closeSheet("sheet-session-manage");
        showToast("已送出移除請求");
      }
    }

    // 任務相關控制
    function openNewTaskSheet() {
      document.getElementById("sheet-task-title").value = "";
      document.getElementById("sheet-task-detail").value = "";
      openSheet("sheet-new-task");
    }
    function submitNewTask() {
      const title = document.getElementById("sheet-task-title").value.trim();
      if (!title || !ws) return;
      const detail = document.getElementById("sheet-task-detail").value.trim();
      ws.send(JSON.stringify({
        op: "task_create",
        title: title,
        detail: detail,
        assignee: activeSession,
        created_by: null,
        depends_on: []
      }));
      closeSheet("sheet-new-task");
      showToast("已建立協作任務");
    }
    function cycleTaskStatus(taskId, currentStatus) {
      if (!ws) return;
      const cycle = { Todo: "Doing", Doing: "Done", Done: "Todo", Blocked: "Doing", Review: "Done" };
      const next = cycle[currentStatus] || "Doing";
      ws.send(JSON.stringify({ op: "task_update", id: taskId, status: next }));
    }

    // 審查註解抽屜
    function openReviewCommentSheet(lineNum, lineContent) {
      pendingReviewLine = lineNum;
      document.getElementById("sheet-review-preview").innerText = `第 ${lineNum} 行：${lineContent}`;
      document.getElementById("sheet-review-text").value = "";
      openSheet("sheet-review-comment");
    }
    function submitReviewComment() {
      const comment = document.getElementById("sheet-review-text").value.trim();
      if (!comment || !activeSession || !ws) return;
      ws.send(JSON.stringify({
        op: "review_comment",
        session: activeSession,
        location: `line:${pendingReviewLine}`,
        comment: comment
      }));
      closeSheet("sheet-review-comment");
      showToast("已送交審查意見給 Agent");
    }

    // 輸入框高度自適應
    const promptTextarea = document.getElementById("prompt-textarea");
    promptTextarea.addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height = (this.scrollHeight) + "px";
    });

    connect();
  </script>
</body>
</html>
