<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0e12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <title>termade companion</title>
  <style>
    :root {
      --bg: #0d0e12;
      --card-bg: #16181f;
      --card-hover: #1e2029;
      --border: #262933;
      --text: #f0f2f5;
      --text-dim: #8b92a5;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --cyan: #06b6d4;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    /* 頂部應用程式列 */
    header {
      background: rgba(16, 18, 24, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: calc(env(safe-area-inset-top, 0px) + 8px) 14px 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 20;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
    }
    .status-dot.connected { background: var(--green); box-shadow: 0 0 8px rgba(16, 185, 129, 0.5); }
    .status-dot.connecting { background: var(--yellow); }
    .status-dot.disconnected { background: var(--red); }
    .session-title-wrap {
      display: flex;
      flex-direction: column;
    }
    .session-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .session-sub {
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-badge {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--cyan);
    }

    /* 主要內容視圖 */
    main {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      -webkit-overflow-scrolling: touch;
    }
    .tab-view {
      display: none;
      height: 100%;
      flex-direction: column;
    }
    .tab-view.active {
      display: flex;
    }

    /* 頂部置頂核准卡片 (若有等待核准) */
    .urgent-banner {
      background: linear-gradient(135deg, #2b1f05 0%, #1c1503 100%);
      border-bottom: 2px solid var(--yellow);
      padding: 12px 14px;
      flex-shrink: 0;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    .urgent-title {
      font-weight: 600;
      font-size: 13px;
      color: var(--yellow);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .urgent-desc {
      font-size: 12px;
      color: #fff;
      font-family: var(--font-mono);
      background: rgba(0,0,0,0.4);
      padding: 6px 8px;
      border-radius: 6px;
      margin-bottom: 10px;
      word-break: break-all;
    }
    .btn-row { display: flex; gap: 8px; }
    .btn-pill {
      flex: 1;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .btn-allow { background: var(--green); color: #000; }
    .btn-always { background: var(--cyan); color: #000; }
    .btn-deny { background: var(--red); color: #fff; }

    /* 對話視圖 (Chat) */
    #chat-transcript {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .bubble {
      max-width: 88%;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      position: relative;
    }
    .bubble-user {
      align-self: flex-end;
      background: #1e3a8a;
      color: #f8fafc;
      border-radius: 18px 18px 4px 18px;
      box-shadow: 0 2px 6px rgba(30, 58, 138, 0.25);
    }
    .bubble-agent {
      align-self: flex-start;
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 18px 18px 18px 4px;
    }
    .bubble pre {
      background: rgba(0,0,0,0.3);
      padding: 8px 10px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      overflow-x: auto;
      margin: 6px 0;
    }
    .bubble code {
      font-family: var(--font-mono);
      font-size: 12px;
      background: rgba(0,0,0,0.3);
      padding: 1px 4px;
      border-radius: 4px;
    }

    /* 工具呼叫卡片 */
    .tool-chip {
      align-self: flex-start;
      width: 100%;
      background: #12141a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
    }
    .tool-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .tool-name {
      font-weight: 600;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tool-body {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(255,255,255,0.06);
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      white-space: pre-wrap;
      max-height: 180px;
      overflow-y: auto;
    }

    /* 對話輸入區域 */
    #chat-composer {
      background: rgba(16, 18, 24, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 8px 12px calc(env(safe-area-inset-bottom, 0px) + 8px) 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    .composer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }
    .toggle-pill {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 3px 8px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
    }
    .toggle-pill.active {
      background: #1c2738;
      border-color: var(--cyan);
      color: var(--cyan);
      font-weight: 600;
    }
    .composer-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    #prompt-textarea {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 8px 14px;
      font-family: var(--font-sans);
      font-size: 14px;
      color: var(--text);
      resize: none;
      min-height: 38px;
      max-height: 120px;
      line-height: 1.4;
      outline: none;
      transition: border-color 0.2s;
    }
    #prompt-textarea:focus {
      border-color: var(--cyan);
    }
    .btn-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-send {
      background: var(--cyan);
      color: #000;
      font-size: 16px;
    }
    .btn-cancel-round {
      background: #2a1b1e;
      color: var(--red);
      border: 1px solid #4a2128;
      font-size: 14px;
    }

    /* 接續醒目標示 */
    .resume-strip {
      background: #261f0a;
      border: 1px solid var(--yellow);
      border-radius: 8px;
      padding: 8px 12px;
      margin: 8px 14px;
      display: none;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--yellow);
    }

    /* 審核視圖 (Approval & Diff) */
    .review-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .section-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .diff-line {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 2px 4px;
      white-space: pre-wrap;
      word-break: break-all;
      cursor: pointer;
    }
    .diff-add { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .diff-del { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .diff-hdr { color: var(--cyan); font-weight: 600; }

    /* 任務板視圖 (Tasks) */
    .tasks-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .task-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .task-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .task-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .task-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 10px;
      cursor: pointer;
    }
    .st-todo { background: #2e2609; color: var(--yellow); border: 1px solid var(--yellow); }
    .st-doing { background: #0c2b1a; color: var(--green); border: 1px solid var(--green); }
    .st-done { background: #1f2024; color: var(--text-dim); text-decoration: line-through; }

    /* Session 切換視圖 (Sessions) */
    .sessions-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .session-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .session-item.active {
      border-color: var(--cyan);
      background: #111a26;
    }
    .session-info-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .session-name {
      font-weight: 600;
      font-size: 14px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .session-meta {
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }

    /* 底部導覽列 (Bottom Navigation Bar) */
    nav {
      background: rgba(16, 18, 24, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      flex-shrink: 0;
      z-index: 20;
    }
    .nav-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 8px 0 6px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--text-dim);
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      position: relative;
    }
    .nav-btn.active {
      color: var(--cyan);
      font-weight: 600;
    }
    .nav-icon {
      font-size: 17px;
      line-height: 1;
    }
    .nav-badge {
      position: absolute;
      top: 4px;
      right: calc(50% - 14px);
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--yellow);
    }

    /* 底部滑出抽屜 (Bottom Sheet) */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 50;
    }
    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .sheet-container {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: #161820;
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 16px 18px calc(env(safe-area-inset-bottom, 0px) + 16px) 18px;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
      z-index: 51;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .sheet-backdrop.open .sheet-container {
      transform: translateY(0);
    }
    .sheet-handle {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: #3a3f50;
      align-self: center;
      margin-bottom: 4px;
    }
    .sheet-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }
    .sheet-input {
      width: 100%;
      background: #0f1015;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-family: var(--font-sans);
      font-size: 14px;
      color: var(--text);
      outline: none;
    }
    .sheet-input:focus {
      border-color: var(--cyan);
    }
    .sheet-btn-row {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    .btn-action {
      flex: 1;
      background: var(--cyan);
      color: #000;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      padding: 11px 0;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-secondary {
      background: var(--card-hover);
      color: var(--text-dim);
      border: 1px solid var(--border);
    }

    /* 懸浮 Toast 提示 */
    #toast {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 52px);
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(22, 24, 32, 0.95);
      border: 1px solid var(--border);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      pointer-events: none;
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 100;
      white-space: nowrap;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    #toast.error {
      border-color: var(--red);
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 頂部應用程式列 -->
    <header>
      <div class="header-left" onclick="switchNavTab('sessions')">
        <span id="conn-dot" class="status-dot"></span>
        <div class="session-title-wrap">
          <div class="session-title">
            <span id="header-label">termade</span>
            <span style="font-size:10px; color:var(--text-dim);">▾</span>
          </div>
          <div id="header-sub" class="session-sub">連線中…</div>
        </div>
      </div>
      <div class="header-right">
        <div id="header-cost" class="header-badge">$0.00</div>
      </div>
    </header>

    <!-- 主內容視圖區 -->
    <main>
      <!-- TAB 1: 對話 (Chat) -->
      <div id="view-chat" class="tab-view active">
        <!-- 待核准置頂橫幅 (若有需要核准的請求) -->
        <div id="urgent-approval-banner" class="urgent-banner" style="display:none;">
          <div class="urgent-title">
            <span>⚠️ 待核准操作 (Waiting Approval)</span>
            <span id="urgent-session-id" style="font-family:var(--font-mono); font-size:11px;"></span>
          </div>
          <div id="urgent-detail" class="urgent-desc"></div>
          <div class="btn-row">
            <button class="btn-pill btn-allow" onclick="submitPermission('Allow')">Allow 放行</button>
            <button class="btn-pill btn-always" onclick="submitPermission('Always')">Always 總是</button>
            <button class="btn-pill btn-deny" onclick="submitPermission('Deny')">Deny 拒絕</button>
          </div>
        </div>

        <!-- 歷史 Session 接續提示條 -->
        <div id="resume-strip" class="resume-strip">
          <span>此對話目前處於結束／中斷狀態</span>
          <button class="btn-pill" style="flex:none; background:var(--yellow); color:#000; padding:4px 10px; font-size:11px;" onclick="resumeCurrentSession()">接續對話 (Resume)</button>
        </div>

        <!-- 即時逐字稿氣泡串流 -->
        <div id="chat-transcript">
          <div style="text-align:center; color:var(--text-dim); margin-top:30px; font-size:12px;">載入中…</div>
        </div>

        <!-- 底部輸入面板 -->
        <div id="chat-composer">
          <div class="composer-toolbar">
            <div id="queue-toggle" class="toggle-pill" onclick="toggleQueue()">
              <span>⚡ 排入佇列</span>
            </div>
            <span id="composer-status" style="color:var(--text-dim); font-size:11px;"></span>
          </div>
          <div class="composer-row">
            <textarea id="prompt-textarea" rows="1" placeholder="輸入 prompt 給 Agent…"></textarea>
            <button id="btn-cancel" class="btn-circle btn-cancel-round" style="display:none;" onclick="cancelTurn()">⏹</button>
            <button id="btn-send" class="btn-circle btn-send" onclick="sendPrompt()">↑</button>
          </div>
        </div>
      </div>

      <!-- TAB 2: 審核與 Diff (Review) -->
      <div id="view-review" class="tab-view">
        <div class="review-wrap">
          <!-- 權限審核卡片 -->
          <div class="section-card">
            <div class="section-title">權限審查 (Approval)</div>
            <div id="review-approval-slot" style="color:var(--text-dim); font-size:13px; margin-top:6px;">
              目前無等待核准的操作。
            </div>
          </div>

          <!-- Git 變更與審查留言 -->
          <div class="section-card" style="flex:1; display:flex; flex-direction:column;">
            <div class="section-header">
              <div class="section-title">工作區變更 (Git Diff)</div>
              <button id="btn-merge-diff" class="btn-pill btn-always" style="display:none; padding:4px 10px; font-size:11px; flex:none;" onclick="confirmMerge()">一鍵 Merge</button>
            </div>
            <div id="diff-status-text" style="color:var(--text-dim); font-size:12px; margin-bottom:8px;">無變更</div>
            <div id="diff-lines-container" style="flex:1; overflow-y:auto;"></div>
          </div>
        </div>
      </div>

      <!-- TAB 3: 任務板 (Tasks) -->
      <div id="view-tasks" class="tab-view">
        <div class="tasks-wrap">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <span style="font-size:14px; font-weight:600; color:var(--text);">協作任務看板</span>
            <button class="btn-pill btn-always" style="flex:none; padding:5px 12px; font-size:12px;" onclick="openNewTaskSheet()">+ 新增任務</button>
          </div>
          <div id="tasks-list"></div>
        </div>
      </div>

      <!-- TAB 4: Session 切換與管理 (Sessions) -->
      <div id="view-sessions" class="tab-view">
        <div class="sessions-wrap">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <span style="font-size:14px; font-weight:600; color:var(--text);">所有 Agent Session</span>
            <button class="btn-pill btn-allow" style="flex:none; padding:5px 12px; font-size:12px;" onclick="openNewSessionSheet()">+ 建立新 Session</button>
          </div>
          <div id="sessions-list"></div>
        </div>
      </div>
    </main>

    <!-- 底部大拇指導覽列 -->
    <nav>
      <button class="nav-btn active" onclick="switchNavTab('chat')">
        <span class="nav-icon">💬</span>
        <span>對話</span>
      </button>
      <button class="nav-btn" onclick="switchNavTab('review')">
        <span id="nav-review-badge" class="nav-badge" style="display:none;"></span>
        <span class="nav-icon">🛡️</span>
        <span>審核</span>
      </button>
      <button class="nav-btn" onclick="switchNavTab('tasks')">
        <span class="nav-icon">📋</span>
        <span>任務</span>
      </button>
      <button class="nav-btn" onclick="switchNavTab('sessions')">
        <span class="nav-icon">⚙️</span>
        <span>Session</span>
      </button>
    </nav>

    <!-- 懸浮提示 Toast -->
    <div id="toast"></div>

    <!-- 抽屜 1：建立新 Session (New Session Sheet) -->
    <div id="sheet-new-session" class="sheet-backdrop" onclick="closeSheetOnBackdrop(event, this)">
      <div class="sheet-container">
        <div class="sheet-handle"></div>
        <div class="sheet-title">建立新 Agent Session</div>
        <div>
          <label style="font-size:12px; color:var(--text-dim); display:block; margin-bottom:4px;">Agent 種類 (Kind)</label>
          <div style="display:flex; gap:8px;">
            <button id="kind-opencode" class="btn-pill btn-always" onclick="selectKind('opencode')">opencode</button>
            <button id="kind-claude" class="btn-pill btn-secondary" onclick="selectKind('claude')">claude</button>
            <button id="kind-antigravity" class="btn-pill btn-secondary" onclick="selectKind('antigravity')">antigravity</button>
          </div>
        </div>
        <div>
          <label style="font-size:12px; color:var(--text-dim); display:block; margin-bottom:4px;">初始 Prompt</label>
          <textarea id="sheet-session-prompt" class="sheet-input" rows="3" placeholder="請描述想要指派給此 Agent 的工作…"></textarea>
        </div>
        <div class="sheet-btn-row">
          <button class="btn-action btn-secondary" onclick="closeSheet('sheet-new-session')">取消</button>
          <button class="btn-action" onclick="submitNewSession()">立即建立啟動</button>
        </div>
      </div>
    </div>

    <!-- 抽屜 2：新增任務 (New Task Sheet) -->
    <div id="sheet-new-task" class="sheet-backdrop" onclick="closeSheetOnBackdrop(event, this)">
      <div class="sheet-container">
        <div class="sheet-handle"></div>
        <div class="sheet-title">建立協作任務</div>
        <div>
          <label style="font-size:12px; color:var(--text-dim); display:block; margin-bottom:4px;">任務標題</label>
          <input id="sheet-task-title" class="sheet-input" placeholder="例如：實作單元測試、修正重試錯誤…">
        </div>
        <div>
          <label style="font-size:12px; color:var(--text-dim); display:block; margin-bottom:4px;">詳細說明 (可選)</label>
          <textarea id="sheet-task-detail" class="sheet-input" rows="2" placeholder="補充驗收標準或脈絡…"></textarea>
        </div>
        <div class="sheet-btn-row">
          <button class="btn-action btn-secondary" onclick="closeSheet('sheet-new-task')">取消</button>
          <button class="btn-action" onclick="submitNewTask()">建立任務</button>
        </div>
      </div>
    </div>

    <!-- 抽屜 3：行內審查註解 (Review Sheet) -->
    <div id="sheet-review-comment" class="sheet-backdrop" onclick="closeSheetOnBackdrop(event, this)">
      <div class="sheet-container">
        <div class="sheet-handle"></div>
        <div class="sheet-title">留下程式碼審查註解</div>
        <div id="sheet-review-preview" style="font-family:var(--font-mono); font-size:11px; background:#000; padding:6px 8px; border-radius:6px; color:var(--text-dim);"></div>
        <div>
          <label style="font-size:12px; color:var(--text-dim); display:block; margin-bottom:4px;">審查意見</label>
          <textarea id="sheet-review-text" class="sheet-input" rows="2" placeholder="指出問題或提出修改建議…"></textarea>
        </div>
        <div class="sheet-btn-row">
          <button class="btn-action btn-secondary" onclick="closeSheet('sheet-review-comment')">取消</button>
          <button class="btn-action" onclick="submitReviewComment()">送出審查註解</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 1. Token 與連線初始化
    let token = "";
    const hash = window.location.hash.substring(1);
    const hashParams = new URLSearchParams(hash);
    if (hashParams.has("token")) {
      token = hashParams.get("token");
      localStorage.setItem("termade_token", token);
      window.location.hash = "";
    } else {
      token = localStorage.getItem("termade_token") || "";
    }

    let ws = null;
    let state = {
      sessions: {},
      tasks: {},
      pending_permissions: {},
      transcripts: {},
      seq: 0
    };
    let activeSession = null;
    let currentTab = "chat";
    let daemonEpoch = null;
    let pendingApprovalReq = null;
    let queueMode = false;
    let selectedKind = "opencode";
    let pendingReviewLine = null;

    // Toast 浮層通知
    function showToast(msg, isError = false) {
      const t = document.getElementById("toast");
      t.innerText = msg;
      t.className = `show ${isError ? "error" : ""}`;
      setTimeout(() => { t.className = ""; }, 2500);
    }

    // WebSocket 連線與斷線自動重試
    function connect() {
      const dot = document.getElementById("conn-dot");
      const sub = document.getElementById("header-sub");
      dot.className = "status-dot connecting";
      sub.innerText = "連線中…";

      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

      ws.onopen = () => {
        dot.className = "status-dot connected";
        sub.innerText = "已連線";
        ws.send(JSON.stringify({
          op: "hello",
          client: "web",
          since: state.seq > 0 ? state.seq : null,
          token: token || null,
          epoch: daemonEpoch
        }));
      };

      ws.onmessage = (event) => {
        try {
          const frame = JSON.parse(event.data);
          handleFrame(frame);
        } catch (e) {
          console.error("Frame parse error:", e);
        }
      };

      ws.onclose = () => {
        dot.className = "status-dot disconnected";
        sub.innerText = "連線中斷，重試中…";
        setTimeout(connect, 2000);
      };

      ws.onerror = () => ws.close();
    }

    // 處理伺服器端 Frame
    function handleFrame(frame) {
      const op = frame.ev;
      if (op === "ready") {
        daemonEpoch = frame.epoch;
      } else if (op === "snapshot") {
        state = frame.state;
        if (!state.transcripts) state.transcripts = {};
        updateAllViews();
      } else if (op === "record") {
        applyRecord(frame.record);
      } else if (op === "diff") {
        renderDiff(frame.diff);
      } else if (op === "ok") {
        if (frame.note) showToast(frame.note);
      } else if (op === "error") {
        showToast(frame.message, true);
      }
    }

    // 增量事件更新
    function applyRecord(record) {
      state.seq = record.seq;
      const event = record.event;
      if (!event) return;
      const kind = event.kind;

      if (kind === "session_started") {
        state.sessions[event.session.id] = event.session;
        if (!state.transcripts[event.session.id]) state.transcripts[event.session.id] = [];
      } else if (kind === "session_status") {
        if (state.sessions[event.session]) {
          state.sessions[event.session].status = event.status;
        }
      } else if (kind === "session_note") {
        if (state.sessions[event.session]) {
          state.sessions[event.session].status_note = event.note;
        }
      } else if (kind === "session_removed") {
        delete state.sessions[event.session];
        delete state.transcripts[event.session];
        if (activeSession === event.session) {
          activeSession = Object.keys(state.sessions)[0] || null;
        }
      } else if (kind === "permission_requested") {
        state.pending_permissions[event.request.req] = event.request;
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      } else if (kind === "permission_resolved") {
        delete state.pending_permissions[event.req];
      } else if (kind === "task_changed") {
        state.tasks[event.task.id] = event.task;
      } else if (kind === "cost") {
        if (state.sessions[event.session]) {
          state.sessions[event.session].cost = event.cost;
        }
      } else if (kind === "user_prompt") {
        if (!state.transcripts[event.session]) state.transcripts[event.session] = [];
        state.transcripts[event.session].push(`> ${event.text}`);
        if (event.session === activeSession) appendBubble(`> ${event.text}`, true);
      } else if (kind === "output") {
        if (!state.transcripts[event.session]) state.transcripts[event.session] = [];
        state.transcripts[event.session].push(event.text);
        if (event.session === activeSession) appendBubble(event.text, false);
      } else if (kind === "tool_call") {
        const icon = event.ok === true ? "✓" : (event.ok === false ? "✗" : "⏳");
        const summary = `[工具 ${event.name}] ${icon} ${event.input || ""}`;
        if (!state.transcripts[event.session]) state.transcripts[event.session] = [];
        state.transcripts[event.session].push(summary);
        if (event.session === activeSession) appendToolChip(event.name, icon, event.input, event.output);
      }

      updateAllViews();
    }

    // 格式化輸出泡泡與 Markdown 簡易轉義
    function appendBubble(rawText, isUser) {
      const box = document.getElementById("chat-transcript");
      const bubble = document.createElement("div");
      bubble.className = `bubble ${isUser ? "bubble-user" : "bubble-agent"}`;
      bubble.innerHTML = renderSimpleMarkdown(rawText);
      box.appendChild(bubble);
      box.scrollTop = box.scrollHeight;
    }

    function appendToolChip(name, icon, input, output) {
      const box = document.getElementById("chat-transcript");
      const chip = document.createElement("div");
      chip.className = "tool-chip";
      chip.innerHTML = `
        <div class="tool-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
          <span class="tool-name">⚡ ${escapeHtml(name)}</span>
          <span style="font-size:11px; color:var(--text-dim);">${icon} 詳細 ▾</span>
        </div>
        <div class="tool-body" style="display:none;">${escapeHtml(input || "")}\n\n${escapeHtml(output || "無進一步輸出")}</div>
      `;
      box.appendChild(chip);
      box.scrollTop = box.scrollHeight;
    }

    function renderSimpleMarkdown(text) {
      let safe = escapeHtml(text || "");
      // 支援 ``` 程式碼區塊
      safe = safe.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (match, lang, code) => {
        return `<pre><code>${code}</code></pre>`;
      });
      // 支援行內 code
      safe = safe.replace(/`([^`]+)`/g, "<code>$1</code>");
      // 支援換行
      safe = safe.replace(/\n/g, "<br>");
      return safe;
    }

    function escapeHtml(str) {
      return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // 畫面完整更新
    function updateAllViews() {
      const sids = Object.keys(state.sessions);
      if (!activeSession && sids.length > 0) {
        activeSession = sids[0];
      }

      // 1. 頂部狀態列
      const current = activeSession ? state.sessions[activeSession] : null;
      document.getElementById("header-label").innerText = current ? (current.label || activeSession) : "termade";
      let totalCost = 0;
      for (const id in state.sessions) {
        const s = state.sessions[id];
        if (s.cost && s.cost.usd) totalCost += s.cost.usd;
      }
      document.getElementById("header-cost").innerText = `$${totalCost.toFixed(2)}`;

      // 2. 核准請求狀態
      const pendingKeys = Object.keys(state.pending_permissions || {});
      const urgentBanner = document.getElementById("urgent-approval-banner");
      const navBadge = document.getElementById("nav-review-badge");
      const reviewSlot = document.getElementById("review-approval-slot");

      if (pendingKeys.length > 0) {
        const req = state.pending_permissions[pendingKeys[0]];
        pendingApprovalReq = req;
        urgentBanner.style.display = "block";
        navBadge.style.display = "block";
        document.getElementById("urgent-session-id").innerText = req.session;
        document.getElementById("urgent-detail").innerText = `${req.title}：${req.detail}`;

        reviewSlot.innerHTML = `
          <div style="background:#221804; border:1px solid var(--yellow); padding:10px 12px; border-radius:8px;">
            <div style="color:var(--yellow); font-weight:600; margin-bottom:4px;">${escapeHtml(req.title)}</div>
            <div style="font-family:var(--font-mono); font-size:12px; margin-bottom:8px;">${escapeHtml(req.detail)}</div>
            <div class="btn-row">
              <button class="btn-pill btn-allow" onclick="submitPermission('Allow')">Allow</button>
              <button class="btn-pill btn-always" onclick="submitPermission('Always')">Always</button>
              <button class="btn-pill btn-deny" onclick="submitPermission('Deny')">Deny</button>
            </div>
          </div>
        `;
      } else {
        urgentBanner.style.display = "none";
        navBadge.style.display = "none";
        pendingApprovalReq = null;
        reviewSlot.innerHTML = `<span style="color:var(--text-dim);">目前無等待核准的操作。</span>`;
      }

      // 3. 逐字稿重繪 (若當前為 chat)
      if (currentTab === "chat") {
        renderCurrentChatTranscript();
      }

      // 4. Session 狀態與接續提示
      const resumeStrip = document.getElementById("resume-strip");
      const cancelBtn = document.getElementById("btn-cancel");
      if (current) {
        const st = (current.status || "").toLowerCase();
        if (st === "failed" || st === "exited") {
          resumeStrip.style.display = "flex";
          cancelBtn.style.display = "none";
        } else {
          resumeStrip.style.display = "none";
          cancelBtn.style.display = (st === "busy") ? "flex" : "none";
        }
      } else {
        resumeStrip.style.display = "none";
        cancelBtn.style.display = "none";
      }

      // 5. 任務板渲染
      renderTasksList();

      // 6. Session 列表渲染
      renderSessionsList();
    }

    function renderCurrentChatTranscript() {
      const box = document.getElementById("chat-transcript");
      box.innerHTML = "";
      if (!activeSession) {
        box.innerHTML = `<div style="text-align:center; color:var(--text-dim); margin-top:30px;">尚無可用 Session，點擊右下角「Session」建立新對話</div>`;
        return;
      }
      const lines = state.transcripts[activeSession] || [];
      if (lines.length === 0) {
        box.innerHTML = `<div style="text-align:center; color:var(--text-dim); margin-top:30px;">尚無對話紀錄，請在下方輸入 Prompt 開始互動</div>`;
        return;
      }

      lines.forEach(line => {
        if (line.startsWith("> ")) {
          appendBubble(line.substring(2), true);
        } else if (line.startsWith("[工具 ")) {
          appendBubble(line, false);
        } else {
          appendBubble(line, false);
        }
      });
      box.scrollTop = box.scrollHeight;
    }

    function renderTasksList() {
      const container = document.getElementById("tasks-list");
      container.innerHTML = "";
      const taskKeys = Object.keys(state.tasks || {});
      if (taskKeys.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:var(--text-dim); margin-top:20px;">目前尚無協作任務</div>`;
        return;
      }

      taskKeys.forEach(id => {
        const t = state.tasks[id];
        const card = document.createElement("div");
        card.className = "task-card";
        const st = (t.status || "todo").toLowerCase();
        const badgeClass = st === "done" ? "st-done" : (st === "doing" ? "st-doing" : "st-todo");
        card.innerHTML = `
          <div class="task-top">
            <span class="task-title">${escapeHtml(t.title)}</span>
            <span class="task-badge ${badgeClass}" onclick="cycleTaskStatus('${t.id}', '${t.status}')">${t.status}</span>
          </div>
          ${t.detail ? `<div style="font-size:12px; color:var(--text-dim);">${escapeHtml(t.detail)}</div>` : ""}
          <div style="font-size:10px; color:#666;">指派：${t.assignee || "未指派"}</div>
        `;
        container.appendChild(card);
      });
    }

    function renderSessionsList() {
      const container = document.getElementById("sessions-list");
      container.innerHTML = "";
      const sids = Object.keys(state.sessions);
      if (sids.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:var(--text-dim); margin-top:20px;">目前尚無任何 Session</div>`;
        return;
      }

      sids.forEach(id => {
        const s = state.sessions[id];
        const item = document.createElement("div");
        item.className = `session-item ${id === activeSession ? "active" : ""}`;
        item.onclick = () => {
          activeSession = id;
          switchNavTab("chat");
        };
        const costStr = s.cost && s.cost.usd ? `$${s.cost.usd.toFixed(2)}` : "$0.00";
        item.innerHTML = `
          <div class="session-info-left">
            <div class="session-name">
              <span>●</span>
              <span>${escapeHtml(s.label || id)}</span>
            </div>
            <div class="session-meta">${s.kind || "agent"} • ${s.status || "idle"}</div>
          </div>
          <div style="font-family:var(--font-mono); font-size:12px; color:var(--cyan);">${costStr}</div>
        `;
        container.appendChild(item);
      });
    }

    // 導覽標籤切換
    function switchNavTab(tabName) {
      currentTab = tabName;
      document.querySelectorAll(".tab-view").forEach(v => v.classList.remove("active"));
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));

      const targetView = document.getElementById(`view-${tabName}`);
      if (targetView) targetView.classList.add("active");

      const navIndices = { chat: 0, review: 1, tasks: 2, sessions: 3 };
      const navBtns = document.querySelectorAll(".nav-btn");
      if (navBtns[navIndices[tabName]]) navBtns[navIndices[tabName]].classList.add("active");

      if (tabName === "chat") {
        renderCurrentChatTranscript();
      } else if (tabName === "review") {
        requestDiff();
      }
    }

    // 傳送 Prompt
    function sendPrompt() {
      const textarea = document.getElementById("prompt-textarea");
      const text = textarea.value.trim();
      if (!text || !activeSession || !ws) return;

      ws.send(JSON.stringify({
        op: "prompt",
        session: activeSession,
        text: text,
        attachments: [],
        queue: queueMode
      }));
      textarea.value = "";
      textarea.style.height = "auto";
    }

    // 佇列開關切換
    function toggleQueue() {
      queueMode = !queueMode;
      const el = document.getElementById("queue-toggle");
      el.className = `toggle-pill ${queueMode ? "active" : ""}`;
      showToast(queueMode ? "已開啟：忙碌時排入佇列" : "已關閉排隊模式");
    }

    // 中斷當前回合
    function cancelTurn() {
      if (!activeSession || !ws) return;
      ws.send(JSON.stringify({ op: "cancel", session: activeSession }));
      showToast("已發送中斷請求…");
    }

    // 接續已結束的 Session
    function resumeCurrentSession() {
      if (!activeSession || !ws) return;
      ws.send(JSON.stringify({
        op: "resume",
        session: activeSession,
        prompt: null
      }));
      showToast("正在接續原對話…");
    }

    // 核准回覆
    function submitPermission(decision) {
      if (!pendingApprovalReq || !ws) return;
      ws.send(JSON.stringify({
        op: "permission",
        session: pendingApprovalReq.session,
        req: pendingApprovalReq.req,
        decision: decision
      }));
      showToast(`已送出核准決定：${decision}`);
    }

    // Diff 請求與渲染
    function requestDiff() {
      if (!activeSession || !ws) return;
      ws.send(JSON.stringify({ op: "worktree_diff", session: activeSession }));
    }

    function renderDiff(diffText) {
      const container = document.getElementById("diff-lines-container");
      container.innerHTML = "";
      const statusText = document.getElementById("diff-status-text");
      const mergeBtn = document.getElementById("btn-merge-diff");

      if (!diffText || diffText.trim().length === 0) {
        statusText.innerText = "目前工作區無未合併之變更。";
        mergeBtn.style.display = "none";
        return;
      }

      statusText.innerText = "變更程式碼 (點擊任一行加入審查註解)：";
      mergeBtn.style.display = "block";

      diffText.split("\n").forEach((line, idx) => {
        const row = document.createElement("div");
        row.className = "diff-line";
        if (line.startsWith("+")) row.classList.add("diff-add");
        else if (line.startsWith("-")) row.classList.add("diff-del");
        else if (line.startsWith("@@") || line.startsWith("diff")) row.classList.add("diff-hdr");
        row.innerText = line;
        row.onclick = () => openReviewCommentSheet(idx + 1, line);
        container.appendChild(row);
      });
    }

    function confirmMerge() {
      if (!activeSession || !ws) return;
      if (window.confirm("確定將此 Session 的 Worktree 變更合併至主分支？")) {
        ws.send(JSON.stringify({ op: "worktree_merge", session: activeSession, message: null }));
        showToast("已送出 Worktree 合併請求");
      }
    }

    // 抽屜控制輔助
    function openSheet(id) {
      document.getElementById(id).classList.add("open");
    }
    function closeSheet(id) {
      document.getElementById(id).classList.remove("open");
    }
    function closeSheetOnBackdrop(e, el) {
      if (e.target === el) el.classList.remove("open");
    }

    // 建立新 Session 抽屜
    function openNewSessionSheet() {
      document.getElementById("sheet-session-prompt").value = "";
      openSheet("sheet-new-session");
    }
    function selectKind(kind) {
      selectedKind = kind;
      ["opencode", "claude", "antigravity"].forEach(k => {
        const btn = document.getElementById(`kind-${k}`);
        btn.className = `btn-pill ${k === kind ? "btn-always" : "btn-secondary"}`;
      });
    }
    function submitNewSession() {
      const p = document.getElementById("sheet-session-prompt").value.trim();
      if (!p || !ws) return;
      ws.send(JSON.stringify({
        op: "spawn",
        kind: selectedKind,
        prompt: p,
        role: "worker",
        worktree: false,
        transport: "auto"
      }));
      closeSheet("sheet-new-session");
      showToast("正在啟動建立新 Agent Session…");
    }

    // 建立新任務抽屜
    function openNewTaskSheet() {
      document.getElementById("sheet-task-title").value = "";
      document.getElementById("sheet-task-detail").value = "";
      openSheet("sheet-new-task");
    }
    function submitNewTask() {
      const title = document.getElementById("sheet-task-title").value.trim();
      if (!title || !ws) return;
      const detail = document.getElementById("sheet-task-detail").value.trim();
      ws.send(JSON.stringify({
        op: "task_create",
        title: title,
        detail: detail,
        assignee: activeSession,
        created_by: null,
        depends_on: []
      }));
      closeSheet("sheet-new-task");
      showToast("已建立新協作任務");
    }

    // 狀態切換
    function cycleTaskStatus(taskId, currentStatus) {
      if (!ws) return;
      const cycle = { Todo: "Doing", Doing: "Done", Done: "Todo", Blocked: "Doing", Review: "Done" };
      const next = cycle[currentStatus] || "Doing";
      ws.send(JSON.stringify({ op: "task_update", id: taskId, status: next }));
    }

    // 審查註解抽屜
    function openReviewCommentSheet(lineNum, lineContent) {
      pendingReviewLine = lineNum;
      document.getElementById("sheet-review-preview").innerText = `第 ${lineNum} 行：${lineContent}`;
      document.getElementById("sheet-review-text").value = "";
      openSheet("sheet-review-comment");
    }
    function submitReviewComment() {
      const comment = document.getElementById("sheet-review-text").value.trim();
      if (!comment || !activeSession || !ws) return;
      ws.send(JSON.stringify({
        op: "review_comment",
        session: activeSession,
        location: `line:${pendingReviewLine}`,
        comment: comment
      }));
      closeSheet("sheet-review-comment");
      showToast("審查註解已送交 Agent");
    }

    // 自動調整輸入框高度
    const promptTextarea = document.getElementById("prompt-textarea");
    promptTextarea.addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height = (this.scrollHeight) + "px";
    });

    // 啟動連線
    connect();
  </script>
</body>
</html>
