name: prepare-release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.6.0). Leave empty to let git-cliff compute it from commits."
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A PAT is required for the pushed tag to trigger release.yml
          # and to bypass branch protection.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Compute bumped version
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --bumped-version

      - name: Resolve version
        id: next
        env:
          INPUT_VERSION: ${{ inputs.version }}
          CLIFF_VERSION: ${{ steps.cliff.outputs.content }}
        run: |
          ver="${INPUT_VERSION:-$CLIFF_VERSION}"
          ver="${ver#v}"
          ver="$(echo "$ver" | tr -d '[:space:]')"
          if ! echo "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version: '$ver'" >&2; exit 1
          fi
          if git rev-parse "v$ver" >/dev/null 2>&1; then
            echo "Tag v$ver already exists" >&2; exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Update Cargo.toml
        run: sed -i 's/^version = ".*"/version = "${{ steps.next.outputs.version }}"/' Cargo.toml

      - name: Generate CHANGELOG
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag v${{ steps.next.outputs.version }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Check (fmt / clippy / Cargo.lock)
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Commit and tag
        run: |
          v="${{ steps.next.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): prepare for v$v"
          git tag -a "v$v" -m "chore: release v$v"
          git push origin HEAD "v$v"

      - name: Dispatch release workflow
        # Tags pushed with GITHUB_TOKEN do not trigger release.yml, so dispatch
        # it explicitly. Skipped when a PAT is used (the tag push triggers it).
        # The `secrets` context is not available in `if`, so expose it via env.
        if: ${{ env.HAS_RELEASE_TOKEN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
        run: gh workflow run release.yml --ref "v${{ steps.next.outputs.version }}"
