name: release
on:
  push:
    tags: ["v*"]
  # Dispatched by prepare-release.yml (tags pushed with GITHUB_TOKEN do not
  # trigger push events). Run it with --ref <tag>.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 確認 tag 與 Cargo.toml 版本一致
        run: |
          ver=$(grep -m1 '^version = "' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [ "${GITHUB_REF_NAME}" != "v${ver}" ]; then
            echo "tag ${GITHUB_REF_NAME} 與 Cargo.toml 版本 v${ver} 不一致" >&2
            exit 1
          fi

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  asset: termade-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, asset: termade-linux-arm64 }
          - { os: macos-latest,     target: aarch64-apple-darwin,      asset: termade-macos-arm64 }
          - { os: macos-15-intel,   target: x86_64-apple-darwin,       asset: termade-macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: 打包
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/termade dist/${{ matrix.asset }}
          tar -C dist -czf dist/${{ matrix.asset }}.tar.gz ${{ matrix.asset }}
          rm dist/${{ matrix.asset }}
          cd dist && (sha256sum ${{ matrix.asset }}.tar.gz 2>/dev/null || shasum -a 256 ${{ matrix.asset }}.tar.gz) > ${{ matrix.asset }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  universal:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: termade-macos-*
          path: in
          merge-multiple: true
      - name: 合併為 universal2
        run: |
          mkdir -p arm x86 dist
          tar -xzf in/termade-macos-arm64.tar.gz -C arm
          tar -xzf in/termade-macos-x86_64.tar.gz -C x86
          lipo -create arm/termade-macos-arm64 x86/termade-macos-x86_64 -output termade-macos-universal
          lipo -info termade-macos-universal
          tar -czf dist/termade-macos-universal.tar.gz termade-macos-universal
          cd dist && shasum -a 256 termade-macos-universal.tar.gz > termade-macos-universal.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: termade-macos-universal
          path: dist/*

  publish:
    needs: [build, universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 透過 git-cliff 產生 Release Notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: RELEASE_NOTES.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 建立 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
