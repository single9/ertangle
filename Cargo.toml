[package]
name = "termade"
description = "Terminal-native multi-agent development environment (TUI)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[[bin]]
name = "termade"
path = "src/main.rs"

[dependencies]
termade-core = { workspace = true }
termade-protocol = { workspace = true }
termade-daemon = { workspace = true }
termade-tui = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
termade-adapter = { workspace = true }

[workspace]
resolver = "2"
members = ["crates/*"]
default-members = [".", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/single9/termade"

[workspace.dependencies]
termade-core = { path = "crates/termade-core" }
termade-protocol = { path = "crates/termade-protocol" }
termade-adapter = { path = "crates/termade-adapter" }
termade-daemon = { path = "crates/termade-daemon" }
termade-tui = { path = "crates/termade-tui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
uuid = { version = "1", features = ["v4", "serde"] }
ratatui = "0.30"
crossterm = "0.29"
portable-pty = "0.9"
unicode-width = "0.2.3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
