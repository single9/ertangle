[package]
name = "ertangle"
description = "Terminal-native multi-agent development environment (TUI)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
# 開發用文件與代理設定不需要發佈到 crates.io
exclude = ["/docs/tickets/", "/.agents/", "/.gemini/", "/.github/", "/AGENTS.md"]

[lints]
workspace = true

[[bin]]
name = "ertangle"
path = "src/main.rs"

[dependencies]
ertangle-core = { workspace = true }
ertangle-protocol = { workspace = true }
ertangle-daemon = { workspace = true }
ertangle-tui = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
serde_json = { workspace = true }
tr = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
ertangle-adapter = { workspace = true }
ertangle-test-support = { workspace = true }

[workspace]
resolver = "2"
members = ["crates/*"]
default-members = [".", "crates/*"]

[workspace.package]
version = "1.6.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/single9/ertangle"

[workspace.dependencies]
ertangle-core = { path = "crates/ertangle-core", version = "1.5.0" }
ertangle-protocol = { path = "crates/ertangle-protocol", version = "1.5.0" }
ertangle-adapter = { path = "crates/ertangle-adapter", version = "1.5.0" }
ertangle-daemon = { path = "crates/ertangle-daemon", version = "1.5.0" }
ertangle-tui = { path = "crates/ertangle-tui", version = "1.5.0" }
ertangle-test-support = { path = "crates/ertangle-test-support" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
uuid = { version = "1", features = ["v4", "serde"] }
ratatui = "0.30"
crossterm = "0.29"
portable-pty = "0.9"
unicode-width = "0.2.3"
# `internal::set_translator` 是 doc(hidden) API，鎖定版本避免小版號變動。
tr = { version = "=0.1.11", default-features = false }
rspolib = "0.1.2"

# Safe Rust 規範 (docs/agents/rust-conventions.md)。clippy 以 `-D warnings` 執行，
# warn 即視為錯誤；測試內的放行設定見 clippy.toml。
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
indexing_slicing = "warn"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[package.metadata.binstall]
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/ertangle-linux-x86_64.tar.gz"
bin-dir = "ertangle-linux-x86_64"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/ertangle-linux-arm64.tar.gz"
bin-dir = "ertangle-linux-arm64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/ertangle-macos-arm64.tar.gz"
bin-dir = "ertangle-macos-arm64"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/ertangle-macos-x86_64.tar.gz"
bin-dir = "ertangle-macos-x86_64"
