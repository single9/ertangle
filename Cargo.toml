[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ade-core = { path = "crates/ade-core" }
ade-protocol = { path = "crates/ade-protocol" }
ade-adapter = { path = "crates/ade-adapter" }
ade-daemon = { path = "crates/ade-daemon" }
ade-tui = { path = "crates/ade-tui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
ratatui = "0.29"
crossterm = "0.28"
portable-pty = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
